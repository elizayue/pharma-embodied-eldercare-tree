"https://arxiv.org/abs/2108.03298"}]}, "11-M3.3": {"what": "低成本开源硬件（如 SO-100 机械臂）配合开源软件栈，让个人和小团队也能完成“采集示教 → 训练策略 → 真机部署”的完整闭环，是入门具身智能的实用起点。", "ask": ["用低成本机械臂做研究有哪些局限（精度、负载、重复性）？", "一次完整的示教采集与训练流程包括哪些步骤？", "如何把实验结果整理成可复现的开源数据集？"], "read": [{"title": "LeRobot 文档", "url": "https://huggingface.co/docs/lerobot/index"}, {"title": "SO-ARM100 开源机械臂", "url": "https://github.com/TheRobotStudio/SO-ARM100"}]}, "12-M1.1": {"what": "衰老伴随各器官系统的渐进变化，核心特征是“储备下降”：平时尚能代偿，但在疾病、手术或用药等应激下更容易失代偿；要区分正常衰老与疾病表现。", "ask": ["什么是“生理储备”？为什么储备下降会让小问题演变成大问题？", "举出两个容易被误认为“正常老化”的疾病表现。", "老年人疾病为什么常出现不典型表现？"], "read": [{"title": "MSD Manual: Physical Changes With Aging", "url": "https://www.msdmanuals.com/professional/geriatrics/approach-to-the-geriatric-patient/physical-changes-with-aging"}]}, "12-M1.2": {"what": "老年人肾功能下降、体脂比例增加、肌肉和体液减少、肝代谢能力可能降低，影响药物的分布与清除；部分药物（如中枢神经系统药物）的敏感性也会改变，因此常需调整剂量。", "ask": ["体成分改变如何影响脂溶性与水溶性药物的分布？", "为什么老年人用药时要关注肾功能评估？", "药代变化与药效敏感性变化有何区别？各举一例。"], "read": [{"title": "MSD Manual: Pharmacokinetics in Older Adults", "url": "https://www.msdmanuals.com/professional/geriatrics/pharmacologic-therapy-in-older-adults/pharmacokinetics-in-older-adults"}, {"title": "MSD Manual: Pharmacodynamics in Older Adults", "url": "https://www.msdmanuals.com/professional/geriatrics/pharmacologic-therapy-in-older-adults/pharmacodynamics-in-older-adults"}]}, "12-M1.3": {"what": "人口老龄化是全球性趋势；世界卫生组织提出“健康老龄化”，强调发展和维护老年人的功能发挥（内在能力与环境的结合），而不仅是没有疾病。", "ask": ["“内在能力”与“功能发挥”分别指什么？", "健康老龄化理念对养老服务和技术设计有何启示？", "查阅最新官方统计时应关注哪些指标？"], "read": [{"title": "WHO: Ageing and health（事实清单，数据以官网最新版本为准）", "url": "https://www.who.int/news-room/fact-sheets/detail/ageing-and-health"}, {"title": "WHO: UN Decade of Healthy Ageing", "url": "https://www.who.int/initiatives/decade-of-healthy-ageing"}]}, "12-M2.1": {"what": "衰弱是多系统储备下降导致对应激的易损性增加的状态，可用表型模型（如体重下降、乏力、活动少、步速慢、握力弱）或累积缺陷模型评估；衰弱可能部分逆转，运动和营养干预是重点。", "ask": ["衰弱表型模型与累积缺陷（衰弱指数）模型有何不同？", "衰弱与失能、共病是什么关系？", "哪些干预被认为有助于预防或延缓衰弱？"], "read": [{"title": "Fried et al., Frailty in Older Adults: Evidence for a Phenotype（2001）", "url": "https://doi.org/10.1093/gerona/56.3.M146"}, {"title": "Clegg et al., Frailty in elderly people（Lancet 2013）", "url": "https://doi.org/10.1016/S0140-6736(12)62167-9"}]}, "12-M2.2": {"what": "跌倒通常是多因素共同作用的结果，包括平衡与步态障碍、肌力下降、视力问题、认知障碍、体位性低血压、某些药物和环境危险等；多因素评估与干预是预防的核心。", "ask": ["跌倒的内在因素与外在因素各有哪些？", "哪些类别的药物会增加跌倒风险？", "跌倒后为什么要关注“害怕跌倒”这一心理问题？"], "read": [{"title": "MSD Manual: Falls in Older Adults", "url": "https://www.msdmanuals.com/professional/geriatrics/falls-in-older-adults/falls-in-older-adults"}, {"title": "WHO: Falls（事实清单）", "url": "https://www.who.int/news-room/fact-sheets/detail/falls"}]}, "12-M2.3": {"what": "肌少症是与年龄相关的骨骼肌质量、力量和功能下降，常用肌力、肌量和身体表现来诊断；营养不良会加重肌少症与衰弱，两者常需要一起筛查和干预。", "ask": ["肌少症诊断中为什么把肌力放在重要位置？", "营养不良与肌少症如何相互影响？", "抗阻运动与蛋白质摄入在干预中各起什么作用？"], "read": [{"title": "Cruz-Jentoft et al., Sarcopenia: revised European consensus on definition and diagnosis（2018）", "url": "https://doi.org/10.1093/ageing/afy169"}, {"title": "MSD Manual: Protein-Energy Undernutrition", "url": "https://www.msdmanuals.com/professional/nutritional-disorders/undernutrition/protein-energy-undernutrition-peu"}]}, "12-M2.4": {"what": "尿失禁、睡眠障碍和谵妄都是常见老年综合征；谵妄是急性起病、注意力障碍、病情波动的急性脑功能紊乱，常由感染、药物、手术等诱发，可预防但容易漏诊。", "ask": ["谵妄与痴呆在起病和病程上有何区别？", "哪些药物可能诱发谵妄？", "尿失禁和夜间睡眠问题为什么会增加跌倒风险？"], "read": [{"title": "Inouye, Westendorp & Saczynski, Delirium in elderly people（Lancet 2014）", "url": "https://doi.org/10.1016/S0140-6736(13)60688-1"}, {"title": "MSD Manual: Urinary Incontinence in Adults", "url": "https://www.msdmanuals.com/professional/genitourinary-disorders/voiding-disorders/urinary-incontinence-in-adults"}]}, "12-M2.5": {"what": "吞咽障碍在卒中、帕金森病、痴呆和衰弱老人中常见，可导致误吸、肺炎、营养不良和脱水；评估后可调整食物质地与进食姿势，并注意口服药的剂型与服用方式。", "ask": ["误吸有哪些表现？“隐性误吸”为什么危险？", "吞咽困难的老人服药时有哪些注意事项（如能否掰开或碾碎）？", "照护者在喂食时应注意什么？"], "read": [{"title": "MSD Manual: Dysphagia", "url": "https://www.msdmanuals.com/professional/gastrointestinal-disorders/esophageal-and-swallowing-disorders/dysphagia"}]}, "12-M3.1": {"what": "老年综合评估（CGA）是多维度、多学科的诊断与干预过程，从躯体、功能、认知、心理和社会支持等方面评估老人，并据此制定和跟进照护计划。", "ask": ["CGA 与普通门诊问诊有何不同？", "为什么 CGA 强调多学科团队？", "评估结果如何转化为具体的照护计划？"], "read": [{"title": "MSD Manual: Comprehensive Geriatric Assessment", "url": "https://www.msdmanuals.com/professional/geriatrics/approach-to-the-geriatric-patient/comprehensive-geriatric-assessment"}, {"title": "Ellis et al., Comprehensive geriatric assessment for older adults admitted to hospital（Cochrane 2017）", "url": "https://doi.org/10.1002/14651858.CD006211.pub3"}]}, "12-M3.2": {"what": "日常生活能力评估分为基本日常生活活动（ADL，如进食、穿衣、如厕、洗浴、转移）和工具性日常生活活动（IADL，如购物、做饭、理财、服药管理），是判断照护需求的基础。", "ask": ["为什么“自己管理服药”属于 IADL？", "IADL 通常比 ADL 更早受损，这对早期发现问题有什么意义？", "ADL 评估结果如何用于确定照护等级？"], "read": [{"title": "Katz et al., Studies of Illness in the Aged: The Index of ADL（JAMA 1963）", "url": "https://doi.org/10.1001/jama.1963.03060120024016"}, {"title": "Lawton & Brody, Assessment of Older People: Self-Maintaining and Instrumental Activities of Daily Living（1969）", "url": "https://doi.org/10.1093/geront/9.3_Part_1.179"}]}, "12-M3.3": {"what": "常用筛查量表帮助快速发现问题：认知筛查（如 MoCA）、跌倒风险评估、营养筛查等。筛查阳性只提示需要进一步评估，不能直接作为诊断。", "ask": ["筛查工具与诊断工具有什么区别？", "文化程度、语言等因素如何影响认知筛查结果？", "把量表做成数字化或机器人交互版本时需要注意什么？"], "read": [{"title": "Nasreddine et al., The Montreal Cognitive Assessment, MoCA（2005）", "url": "https://doi.org/10.1111/j.1532-5415.2005.53221.x"}, {"title": "MSD Manual: Comprehensive Geriatric Assessment（含常用评估工具）", "url": "https://www.msdmanuals.com/professional/geriatrics/approach-to-the-geriatric-patient/comprehensive-geriatric-assessment"}]}, "12-M4.1": {"what": "痴呆是以认知功能下降并影响日常生活为特征的综合征，阿尔茨海默病是最常见的病因；除认知症状外，精神行为症状（BPSD）对照护影响很大，非药物干预优先。", "ask": ["轻度认知障碍与痴呆如何区分？", "精神行为症状有哪些？为什么首选非药物干预？", "痴呆照护中，技术产品可以在哪些方面提供帮助？"], "read": [{"title": "MSD Manual: Alzheimer Disease", "url": "https://www.msdmanuals.com/professional/neurologic-disorders/delirium-and-dementia/alzheimer-disease"}, {"title": "Livingston et al., Dementia prevention, intervention, and care: 2024 report of the Lancet standing Commission", "url": "https://doi.org/10.1016/S0140-6736(24)01296-0"}]}, "12-M4.2": {"what": "高血压、糖尿病、冠心病与心力衰竭在老年人中常见且常并存；老年人的治疗目标需要个体化，兼顾获益、低血压与低血糖等风险，以及多重用药负担。", "ask": ["为什么老年人的血压和血糖控制目标需要个体化？", "低血糖和体位性低血压对老年人有哪些特殊危害？", "心衰老人居家管理中，体重和症状监测有什么作用？"], "read": [{"title": "WHO: Hypertension（事实清单）", "url": "https://www.who.int/news-room/fact-sheets/detail/hypertension"}, {"title": "WHO: Diabetes（事实清单）", "url": "https://www.who.int/news-room/fact-sheets/detail/diabetes"}]}, "12-M4.3": {"what": "帕金森病以运动迟缓、静止性震颤、肌强直和姿势不稳为主要表现，并有多种非运动症状；卒中后常遗留运动、语言、吞咽等功能障碍，康复训练对功能恢复很重要。", "ask": ["帕金森病药物为什么需要严格按时服用？", "卒中后康复包括哪些方面？", "这两类患者在跌倒和吞咽方面有哪些共同风险？"], "read": [{"title": "MSD Manual: Parkinson Disease", "url": "https://www.msdmanuals.com/professional/neurologic-disorders/movement-and-cerebellar-disorders/parkinson-disease"}, {"title": "MSD Manual: Overview of Stroke", "url": "https://www.msdmanuals.com/professional/neurologic-disorders/stroke/overview-of-stroke"}]}, "12-M4.4": {"what": "骨质疏松使骨强度下降、骨折风险增加，与跌倒叠加时风险更高；骨关节炎导致关节疼痛与活动受限，影响老人的活动能力和生活质量。", "ask": ["为什么骨质疏松常被称为“沉默的疾病”？", "预防骨折为什么要同时关注骨骼与跌倒？", "骨关节炎的疼痛管理中，老年人用药需注意哪些风险？"], "read": [{"title": "MSD Manual: Osteoporosis", "url": "https://www.msdmanuals.com/professional/musculoskeletal-and-connective-tissue-disorders/osteoporosis/osteoporosis"}, {"title": "WHO: Osteoarthritis（事实清单）", "url": "https://www.who.int/news-room/fact-sheets/detail/osteoarthritis"}]}, "12-M4.5": {"what": "慢阻肺是以持续气流受限为特征的常见慢性呼吸系统疾病，吸入装置的正确使用至关重要；老年人和照护机构居民易发生呼吸道等感染，需要疫苗接种与感染防控。", "ask": ["为什么吸入装置使用错误会影响疗效？", "养老机构中常见的感染防控措施有哪些？", "慢阻肺急性加重有哪些早期信号？"], "read": [{"title": "WHO: Chronic obstructive pulmonary disease（事实清单）", "url": "https://www.who.int/news-room/fact-sheets/detail/chronic-obstructive-pulmonary-disease-(copd)"}, {"title": "GOLD 慢阻肺全球倡议（指南以官网最新版本为准）", "url": "https://goldcopd.org/"}]}, "12-M4.6": {"what": "共病指同时患有多种慢病，单病种指南叠加容易造成治疗负担过重和药物相互作用；以人为中心的照护根据老人的意愿、预期寿命和优先事项确定治疗目标。", "ask": ["为什么单病种指南直接叠加可能对共病老人不利？", "如何了解老人自己最看重的健康目标？", "治疗目标调整后，用药方案可以如何相应改变？"], "read": [{"title": "American Geriatrics Society Expert Panel, Guiding Principles for the Care of Older Adults with Multimorbidity（2012）", "url": "https://doi.org/10.1111/j.1532-5415.2012.04188.x"}, {"title": "MSD Manual: Therapeutic Objectives in Older Adults", "url": "https://www.msdmanuals.com/professional/geriatrics/aging-and-quality-of-life/therapeutic-objectives-in-older-adults"}]}, "13-M1.1": {"what": "多重用药通常指同时使用多种药物，文献中定义并不统一（常见以药物数量为界，也有强调“是否适当”的定义）；它与药物不良反应、相互作用、跌倒、住院和依从性下降等风险相关。", "ask": ["为什么单纯以药物数量定义多重用药不够？", "“适当的多重用药”与“不适当的多重用药”有何区别？", "多重用药会带来哪些具体风险？"], "read": [{"title": "Masnoon et al., What is polypharmacy? A systematic review of definitions（2017）", "url": "https://doi.org/10.1186/s12877-017-0621-2"}, {"title": "MSD Manual: Medication-Related Problems in Older Adults", "url": "https://www.msdmanuals.com/professional/geriatrics/pharmacologic-therapy-in-older-adults/medication-related-problems-in-older-adults"}]}, "13-M1.2": {"what": "处方瀑布指一种药物的不良反应被误认为新的疾病，于是又开出另一种药来治疗，导致用药不断叠加；识别它的关键是把新症状和近期用药变化联系起来。", "ask": ["举一个处方瀑布的典型例子。", "新出现的症状时，为什么要先问“最近换过或加过什么药”？", "用药记录系统如何帮助识别处方瀑布？"], "read": [{"title": "Rochon & Gurwitz, Optimising drug treatment for elderly people: the prescribing cascade（BMJ 1997）", "url": "https://doi.org/10.1136/bmj.315.7115.1096"}]}, "13-M1.3": {"what": "许多药物具有抗胆碱能作用，多种叠加形成“抗胆碱能负荷”，可能导致认知下降、谵妄、便秘、尿潴留与跌倒；镇静催眠药、部分精神类药物和降压药等也与跌倒风险相关。", "ask": ["抗胆碱能不良反应有哪些典型表现？", "抗胆碱能负荷量表的用途和局限是什么？", "哪些类别的药物常被称为“增加跌倒风险的药物”？"], "read": [{"title": "Salahudeen, Duffull & Nishtala, Anticholinergic burden quantified by anticholinergic risk scales and adverse outcomes in older people: a systematic review（2015）", "url": "https://doi.org/10.1186/s12877-015-0029-9"}, {"title": "MSD Manual: Drug Categories of Concern in Older Adults", "url": "https://www.msdmanuals.com/professional/geriatrics/pharmacologic-therapy-in-older-adults/drug-categories-of-concern-in-older-adults"}]}, "13-M2.1": {"what": "Beers 标准由美国老年医学会定期更新，列出老年人一般应避免、特定疾病下应避免、需谨慎使用、需注意相互作用或按肾功能调整剂量的药物；它是辅助判断的工具，不能替代个体化评估。", "ask": ["Beers 标准包括哪几类表格？", "为什么说 Beers 标准不是“禁用清单”？", "使用时为什么要确认采用的是最新版本？"], "read": [{"title": "American Geriatrics Society, 2023 Updated AGS Beers Criteria（以 AGS 最新发布版本为准）", "url": "https://doi.org/10.1111/jgs.18372"}]}, "13-M2.2": {"what": "STOPP / START 标准源自欧洲，STOPP 列出潜在不适当处方，START 列出可能被遗漏的应用药物，按生理系统组织，同时关注“用错药”和“该用未用”。", "ask": ["START 部分关注的“处方遗漏”为什么同样重要？", "STOPP/START 与 Beers 标准在设计上有什么不同？", "把这些标准写成规则引擎时会遇到哪些困难？"], "read": [{"title": "O'Mahony et al., STOPP/START criteria for potentially inappropriate prescribing in older people: version 3（2023）", "url": "https://doi.org/10.1007/s41999-023-00777-y"}]}, "13-M2.3": {"what": "中国也制定了本土的老年人潜在不适当用药判断标准，考虑国内常用药品与临床实践，并区分风险强度和用药优先级；学习时应查找相关学会发布的最新版原文，并与国际标准对照。", "ask": ["为什么需要符合本国药品目录和临床习惯的 PIM 标准？", "国内标准与 Beers、STOPP/START 相比可能有哪些差异？", "在国内做老年用药规则系统时，应以哪些文件为依据？"], "read": [{"title": "American Geriatrics Society, 2023 Updated AGS Beers Criteria（国际对照）", "url": "https://doi.org/10.1111/jgs.18372"}, {"title": "O'Mahony et al., STOPP/START version 3（国际对照）", "url": "https://doi.org/10.1007/s41999-023-00777-y"}]}, "13-M2.4": {"what": "减药 / 停药是有计划地在医疗人员指导下减少或停用获益不再大于风险的药物，一般包括梳理用药、评估每种药的风险获益、确定可停用药物、制定逐步减停计划并监测。", "ask": ["减药流程通常包含哪些步骤？", "为什么有些药物不能突然停用？", "减药过程中如何与老人和家属沟通？"], "read": [{"title": "Scott et al., Reducing Inappropriate Polypharmacy: The Process of Deprescribing（JAMA Intern Med 2015）", "url": "https://doi.org/10.1001/jamainternmed.2015.0324"}, {"title": "Deprescribing.org（减药指南与工具）", "url": "https://deprescribing.org/"}]}, "13-M3.1": {"what": "依从性受多方面因素影响：认知与记忆、视力与听力、手部功能（开瓶、掰药）、经济负担、对疾病和药物的认知、副作用，以及方案的复杂程度（次数、种类、特殊服法）。", "ask": ["区分“有意不依从”和“无意不依从”。", "方案复杂度为什么是可以优先改进的因素？", "设计提醒产品时，如何考虑老人的视力与手部功能？"], "read": [{"title": "Osterberg & Blaschke, Adherence to Medication（NEJM 2005）", "url": "https://doi.org/10.1056/NEJMra050100"}, {"title": "MSD Manual: Adherence to a Medication Regimen", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/factors-affecting-response-to-medications/adherence-to-a-medication-regimen"}]}, "13-M3.2": {"what": "依从性测量方法各有优缺点：自报简便但易高估，药片计数和药房取药记录较客观但不能证明真正服下，电子监测记录开盖时间但成本较高。", "ask": ["为什么自报的依从性往往偏高？", "智能药盒记录“开盖”是否等于“已服药”？", "研究中如何组合多种测量方法？"], "read": [{"title": "Osterberg & Blaschke, Adherence to Medication（NEJM 2005）", "url": "https://doi.org/10.1056/NEJMra050100"}]}, "13-M3.3": {"what": "提升依从性的常用策略包括简化方案（减少次数、使用复方或长效制剂）、分装药盒、提醒工具、用药教育，以及家属和照护者参与；通常需要多种措施组合。", "ask": ["简化方案时需要哪些专业人员参与？", "提醒工具的效果为什么常因人而异？", "照护者参与用药管理时应注意什么？"], "read": [{"title": "MSD Manual: Adherence to a Medication Regimen", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/factors-affecting-response-to-medications/adherence-to-a-medication-regimen"}, {"title": "MSD Manual: Pharmacists and Older Adults", "url": "https://www.msdmanuals.com/professional/geriatrics/providing-care-to-older-adults/pharmacists-and-older-adults"}]}, "13-M4.1": {"what": "药物重整是在转诊、入院、出院等交接时，把患者实际使用的全部药物（含非处方药和保健品）与新医嘱逐一核对，发现并解决差异；准确的用药清单是基础。", "ask": ["为什么交接环节最容易出现用药差错？", "完整的用药清单应包括哪些信息？", "社区药师在药物重整中能发挥什么作用？"], "read": [{"title": "AHRQ PSNet: Medication Reconciliation", "url": "https://psnet.ahrq.gov/primer/medication-reconciliation"}]}, "13-M4.2": {"what": "养老机构用药管理覆盖领药、储存、分药、给药、记录和观察各环节，常用核对原则（如核对对象、药品、剂量、时间、途径）减少差错，并需要药师和医护的支持。", "ask": ["用药管理中最容易出错的环节有哪些？", "给药记录为什么要及时、可追溯？", "引入自动分药或扫码给药时，原有流程需要哪些调整？"], "read": [{"title": "MSD Manual: Medication Errors", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/concepts-in-pharmacotherapy/medication-errors"}, {"title": "WHO: Medication Without Harm", "url": "https://www.who.int/initiatives/medication-without-harm"}]}, "13-M4.3": {"what": "老年人的药物不良事件表现常不典型（如意识改变、跌倒、食欲下降），需要照护者留意；识别后应按规定向医疗人员和药品不良反应监测系统报告。", "ask": ["老人出现新症状时，照护者应如何考虑药物原因？", "不良反应、不良事件和用药差错有何区别？", "为什么要重视上报，即使不确定是否由药物引起？"], "read": [{"title": "MSD Manual: Adverse Drug Reactions", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/concepts-in-pharmacotherapy/adverse-drug-reactions"}, {"title": "WHO: Medication Without Harm", "url": "https://www.who.int/initiatives/medication-without-harm"}]}, "13-M4.4": {"what": "临床决策支持系统可把 PIM 标准、剂量调整和相互作用规则嵌入处方流程中给出提醒；设计时要避免“警报疲劳”，并明确系统只辅助、由专业人员决策。监管上，部分 CDS 软件可能属于医疗器械（以官方最新要求为准）。", "ask": ["什么是警报疲劳？如何减少无效提醒？", "把 Beers 标准写成规则时需要哪些患者数据？", "哪些 CDS 功能可能被监管机构视为医疗器械软件？"], "read": [{"title": "FDA: Clinical Decision Support Software（指南以官网最新版本为准）", "url": "https://www.fda.gov/regulatory-information/search-fda-guidance-documents/clinical-decision-support-software"}, {"title": "American Geriatrics Society, 2023 Updated AGS Beers Criteria", "url": "https://doi.org/10.1111/jgs.18372"}]}, "14-M1.1": {"what": "养老服务一般分为居家、社区和机构三种形态，医养结合把医疗服务与养老服务衔接起来；不同形态在服务内容、费用与适合人群上各不相同，技术方案需要匹配具体场景。", "ask": ["居家、社区与机构养老分别适合什么样的老人？", "医养结合要解决的核心问题是什么？", "同一款产品放在居家和机构场景中，需求会有哪些不同？"], "read": [{"title": "MSD Manual: Overview of Geriatric Care", "url": "https://www.msdmanuals.com/professional/geriatrics/providing-care-to-older-adults/overview-of-geriatric-care"}, {"title": "WHO: Framework for countries to achieve an integrated continuum of long-term care", "url": "https://www.who.int/publications/i/item/9789240038844"}]}, "14-M1.2": {"what": "长期护理保险为失能人员的长期照护提供资金保障，通常以失能等级评估确定待遇；我国自试点以来逐步推进，具体政策与评估标准以国家医保局等官方最新文件为准。", "ask": ["失能等级评估通常依据哪些维度？", "长期护理保险与医疗保险覆盖的内容有何不同？", "照护等级评估结果会如何影响服务提供方式？"], "read": [{"title": "国家医疗保障局官网（长期护理保险政策以官网最新文件为准）", "url": "https://www.nhsa.gov.cn/"}, {"title": "WHO: Framework for countries to achieve an integrated continuum of long-term care", "url": "https://www.who.int/publications/i/item/9789240038844"}]}, "14-M1.3": {"what": "照护工作劳动强度大、专业要求高，照护人力普遍短缺；家庭照护者常承受身体、心理、经济和社交上的负担，照护者支持本身就是养老服务的重要组成部分。", "ask": ["照护者负担包括哪些方面？如何评估？", "喘息服务对家庭照护者有什么意义？", "技术应该替代照护者，还是减轻他们的负担？两者有何区别？"], "read": [{"title": "MSD Manual: Family Caregiving for Older Adults", "url": "https://www.msdmanuals.com/professional/geriatrics/social-issues-in-older-adults/family-caregiving-for-older-adults"}, {"title": "Zarit, Reever & Bach-Peterson, Relatives of the Impaired Elderly: Correlates of Feelings of Burden（1980）", "url": "https://doi.org/10.1093/geront/20.6.649"}]}, "14-M2.1": {"what": "生活照料覆盖进食、如厕、洗浴、穿衣和转移等日常活动，是失能老人最基本的照护需求；照料时既要保证安全，也要尽量保留老人的自主能力与尊严。", "ask": ["哪些生活照料环节最容易发生跌倒或受伤？", "“帮得太多”为什么可能加速功能退化？", "机器人辅助生活照料时，隐私和尊严方面要注意什么？"], "read": [{"title": "Katz et al., Studies of Illness in the Aged: The Index of ADL（JAMA 1963）", "url": "https://doi.org/10.1001/jama.1963.03060120024016"}, {"title": "MSD Manual: Home Health Care", "url": "https://www.msdmanuals.com/professional/geriatrics/providing-care-to-older-adults/home-health-care"}]}, "14-M2.2": {"what": "失能与认知症照护需要关注安全（走失、跌倒、误服）、日常结构与沟通方式，以及精神行为症状的识别与应对；以人为中心的照护理念强调理解老人的生活史与偏好。", "ask": ["与认知症老人沟通时有哪些技巧？", "精神行为症状常有哪些诱因？照护者可以如何应对？", "防走失技术需要在安全与自由之间如何平衡？"], "read": [{"title": "MSD Manual: Behavioral and Psychologic Symptoms of Dementia", "url": "https://www.msdmanuals.com/professional/neurologic-disorders/delirium-and-dementia/behavioral-and-psychologic-symptoms-of-dementia"}, {"title": "WHO: Dementia（事实清单）", "url": "https://www.who.int/news-room/fact-sheets/detail/dementia"}]}, "14-M2.3": {"what": "康复与功能维持旨在帮助老人恢复或保持活动、自理与参与能力，包括运动训练、作业治疗、言语与吞咽训练等，需要持续进行并融入日常生活。", "ask": ["康复与功能维持在目标上有什么不同？", "为什么居家康复的长期坚持很困难？", "康复机器人与游戏化训练可能在哪些方面提高坚持率？"], "read": [{"title": "WHO: Rehabilitation（事实清单）", "url": "https://www.who.int/news-room/fact-sheets/detail/rehabilitation"}, {"title": "MSD Manual: Prevention of Frailty", "url": "https://www.msdmanuals.com/professional/geriatrics/prevention-of-disease-and-disability-in-older-adults/prevention-of-frailty"}]}, "14-M2.4": {"what": "孤独感（主观感受）与社会隔离（客观社会联系少）在老年人中常见，并与身心健康不良结局相关；社会参与和心理支持是照护的重要内容。", "ask": ["孤独感与社会隔离有什么区别？", "独居老人面临哪些特殊风险？", "陪伴技术能否真正缓解孤独？可能有哪些副作用？"], "read": [{"title": "WHO: Social Isolation and Loneliness", "url": "https://www.who.int/teams/social-determinants-of-health/demographic-change-and-healthy-ageing/social-isolation-and-loneliness"}, {"title": "NASEM, Social Isolation and Loneliness in Older Adults（2020）", "url": "https://doi.org/10.17226/25663"}]}, "14-M2.5": {"what": "安宁疗护为生命末期患者提供缓解痛苦和症状、心理与灵性支持以及家属支持，重视患者的意愿与生活质量，而非延长生命本身。", "ask": ["安宁疗护与一般临终照顾有何不同？", "预立医疗照护计划为什么重要？", "技术在安宁疗护中应扮演什么角色？有哪些不应做的事？"], "read": [{"title": "WHO: Palliative care（事实清单）", "url": "https://www.who.int/news-room/fact-sheets/detail/palliative-care"}]}, "14-M3.1": {"what": "可穿戴设备（手环、手表、贴片等）可连续监测心率、活动、睡眠与跌倒等信息；在老年人中使用需考虑佩戴依从性、充电、准确性以及数据如何被真正用于照护决策。", "ask": ["消费级可穿戴设备与医疗级设备有何区别？", "老人为什么常常不愿长期佩戴设备？", "大量监测数据如何转化为照护者能用的提醒，而不是噪声？"], "read": [{"title": "Majumder, Mondal & Deen, Wearable Sensors for Remote Health Monitoring（2017）", "url": "https://doi.org/10.3390/s17010130"}]}, "14-M3.2": {"what": "非接触式监测利用毫米波雷达、红外、门磁、床垫传感器等识别活动、睡眠与异常情况，无需佩戴、对隐私的影响通常小于摄像头，但识别准确率与误报需要评估。", "ask": ["毫米波雷达能感知哪些信息？有哪些局限？", "为什么非接触式方案常被认为比摄像头更易被接受？", "误报和漏报分别会对照护造成什么影响？"], "read": [{"title": "Mubashir, Shao & Seed, A survey on fall detection: Principles and approaches（含环境传感类方法）", "url": "https://doi.org/10.1016/j.neucom.2011.09.037"}]}, "14-M3.3": {"what": "远程医疗与慢病远程管理通过视频问诊、远程监测和随访，让老人在家中获得持续的医疗支持，适合血压、血糖、心衰等慢病管理，但需要考虑数字能力与照护者协助。", "ask": ["远程监测数据异常时，应由谁、如何响应？", "哪些老人可能难以使用远程医疗？如何弥补？", "远程医疗与线下就诊如何衔接？"], "read": [{"title": "WHO: Integrated care for older people（ICOPE）指南", "url": "https://www.who.int/publications/i/item/9789241550109"}, {"title": "Choi & DiNitto, The Digital Divide Among Low-Income Homebound Older Adults（2013）", "url": "https://doi.org/10.2196/jmir.2645"}]}, "14-M3.4": {"what": "适老化设计考虑视力、听力、运动和认知变化：大字号与高对比度、简洁的界面层级、容错设计、语音交互等；无障碍标准（如 WCAG）提供可参考的具体要求（以 W3C 最新版本为准）。", "ask": ["老年用户在使用触屏界面时常遇到哪些困难？", "语音交互对老人有哪些优势和局限？", "WCAG 的哪些原则与老年用户最相关？"], "read": [{"title": "W3C WAI: Older Users and Web Accessibility", "url": "https://www.w3.org/WAI/older-users/"}, {"title": "W3C: Web Content Accessibility Guidelines (WCAG) 2.2（以最新版本为准）", "url": "https://www.w3.org/TR/WCAG22/"}]}, "14-M3.5": {"what": "养老信息系统管理老人档案、照护计划、服务记录与用药记录，与医疗机构的健康档案互联可以支持连续照护；数据标准（如 HL7 FHIR）有助于系统之间交换信息。", "ask": ["养老信息系统需要记录哪些核心数据？", "为什么不同系统间的数据互通很困难？", "健康档案共享时如何保护隐私？"], "read": [{"title": "HL7 FHIR 标准（以官网最新版本为准）", "url": "https://hl7.org/fhir/"}]}, "14-M4.1": {"what": "老年用户研究常用访谈、实地观察、日记研究和参与式设计等方法，让老人、照护者和机构人员参与需求定义与原型评估，避免设计者想当然。", "ask": ["为什么要同时研究老人和照护者？", "与认知障碍老人开展研究时有哪些伦理与方法上的注意事项？", "参与式设计与普通可用性测试有何区别？"], "read": [{"title": "Chen & Chan, Gerontechnology acceptance by elderly Hong Kong Chinese: a senior technology acceptance model（STAM, 2014）", "url": "https://doi.org/10.1080/00140139.2014.895855"}, {"title": "W3C WAI: Older Users and Web Accessibility", "url": "https://www.w3.org/WAI/older-users/"}]}, "14-M4.2": {"what": "技术接受度模型解释人们是否愿意使用一项技术（如感知有用性、易用性、社会影响、便利条件）；数字鸿沟指不同人群在接入、技能和使用效果上的差距，老年人往往处于不利位置。", "ask": ["UTAUT 模型包含哪些核心因素？", "老年人技术接受度模型增加了哪些与老人相关的因素？", "产品设计可以如何减小数字鸿沟？"], "read": [{"title": "Venkatesh et al., User Acceptance of Information Technology: Toward a Unified View（UTAUT, 2003）", "url": "https://doi.org/10.2307/30036540"}, {"title": "Choi & DiNitto, The Digital Divide Among Low-Income Homebound Older Adults（2013）", "url": "https://doi.org/10.2196/jmir.2645"}]}, "14-M4.3": {"what": "评估养老技术的效果需要从临床结局（如跌倒、住院）、功能与生活质量、照护者负担以及成本效益等多维度考察，并选择合适的研究设计。", "ask": ["为什么“用户满意”不能代替临床结局评估？", "复杂干预的评估为什么需要关注实施过程？", "成本效益分析需要收集哪些数据？"], "read": [{"title": "Skivington et al., A new framework for developing and evaluating complex interventions（MRC 框架，BMJ 2021）", "url": "https://doi.org/10.1136/bmj.n2061"}]}, "15-M1.1": {"what": "尊重自主意味着在充分知情的基础上由本人做决定；认知障碍者的决策能力可能因事而异，需要评估具体决策能力，并在必要时依法由代理人决策，同时尽量让本人参与。", "ask": ["决策能力评估通常考察哪些方面？", "为什么决策能力是“针对具体决定”的？", "为认知障碍老人部署监测设备时，如何尽可能尊重其意愿？"], "read": [{"title": "Appelbaum, Assessment of Patients' Competence to Consent to Treatment（NEJM 2007）", "url": "https://doi.org/10.1056/NEJMcp074045"}]}, "15-M1.2": {"what": "陪伴机器人引发的伦理争议包括：让认知障碍者误以为机器人是活物是否构成欺骗、可能造成情感依赖、可能被用来减少真人陪伴，以及隐私和尊严问题。", "ask": ["对认知障碍老人使用拟人化机器人是否构成“欺骗”？", "如何避免机器人成为减少人际关怀的借口？", "哪些设计做法可以降低这些伦理风险？"], "read": [{"title": "Sharkey & Sharkey, Granny and the robots: ethical issues in robot care for the elderly（2010 在线发表）", "url": "https://doi.org/10.1007/s10676-010-9234-6"}]}, "15-M1.3": {"what": "AI 系统可能因训练数据中老年人代表性不足或带有年龄刻板印象而表现更差或做出歧视性决定；世界卫生组织专门讨论了健康 AI 中的年龄歧视问题。", "ask": ["训练数据中老年人代表性不足会导致什么后果？", "如何评估一个模型在不同年龄组上的表现差异？", "产品团队可以采取哪些措施减少年龄偏见？"], "read": [{"title": "WHO: Ageism in artificial intelligence for health（2022）", "url": "https://www.who.int/publications/i/item/9789240040793"}]}, "15-M1.4": {"what": "机器人或 AI 出错时，责任可能涉及制造商、开发者、部署机构、操作者与使用者；学习型系统的行为难以完全预测，带来所谓“责任鸿沟”，需要通过设计、记录和制度安排来明确责任。", "ask": ["什么是“责任鸿沟”？", "日志记录与可追溯性如何帮助事故后的责任认定？", "在养老机构部署机器人时，应提前明确哪些责任分工？"], "read": [{"title": "Matthias, The responsibility gap: Ascribing responsibility for the actions of learning automata（2004）", "url": "https://doi.org/10.1007/s10676-004-3422-1"}, {"title": "WHO: Ethics and governance of artificial intelligence for health", "url": "https://www.who.int/publications/i/item/9789240029200"}]}, "15-M2.1": {"what": "健康数据属于敏感个人信息，处理时需要合法依据、明确目的、最小必要和充分告知，并采取安全保护措施；我国《个人信息保护法》对敏感个人信息有专门规定（以官方发布文本为准）。", "ask": ["什么是敏感个人信息？健康数据为什么属于此类？", "处理敏感个人信息需要满足哪些额外条件？", "老人家属代为同意时需要注意什么？"], "read": [{"title": "中华人民共和国个人信息保护法（网信办转载全文，以官方发布文本为准）", "url": "https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm"}]}, "15-M2.2": {"what": "家庭中的摄像头和传感器可提升安全，但也会侵入私人空间；常用的权衡做法包括选择隐私侵入较低的传感器、在设备端本地处理只上传事件、让老人知情并可控制。", "ask": ["摄像头、毫米波雷达和门磁在隐私影响上有何差异？", "“本地处理、只上传事件”如何降低隐私风险？", "浴室、卧室等私密区域的监测应遵循什么原则？"], "read": [{"title": "WHO: Ethics and governance of artificial intelligence for health", "url": "https://www.who.int/publications/i/item/9789240029200"}, {"title": "中华人民共和国个人信息保护法（以官方发布文本为准）", "url": "https://www.cac.gov.cn/2021-08/20/c_1631050028355286.htm"}]}, "15-M2.3": {"what": "医疗 AI 的数据治理涵盖数据来源与授权、质量与标注、访问控制、去标识化与再识别风险评估，以及模型全生命周期的监督。去标识化不等于绝对匿名。", "ask": ["去标识化与匿名化有何区别？", "为什么组合多个看似无害的字段可能导致再识别？", "数据治理应在模型开发的哪些阶段介入？"], "read": [{"title": "WHO: Ethics and governance of artificial intelligence for health", "url": "https://www.who.int/publications/i/item/9789240029200"}]}, "15-M3.1": {"what": "我国近年出台了发展银发经济、智慧健康养老等相关政策文件，为养老产业和适老化技术提供方向；政策更新较快，应持续跟踪官方最新文件。", "ask": ["银发经济政策中与智慧养老和康复辅具相关的方向有哪些？", "如何快速查找某项政策的原文及配套文件？", "政策导向对产品立项有什么影响？"], "read": [{"title": "国务院办公厅关于发展银发经济增进老年人福祉的意见（以官方最新文件为准）", "url": "https://www.gov.cn/zhengce/content/202401/content_6926087.htm"}]}, "15-M3.2": {"what": "医疗器械按风险分类管理；具有医疗用途的软件（包括 AI 软件）可能作为医疗器械需要注册或审批。判断依据是预期用途和风险，具体以各国监管机构最新规定为准。", "ask": ["什么是“软件即医疗器械（SaMD）”？", "同一款健康 App，什么情况下会被视为医疗器械？", "AI 医疗软件在上市后更新模型时可能面临什么监管问题？"], "read": [{"title": "FDA: Software as a Medical Device (SaMD)", "url": "https://www.fda.gov/medical-devices/digital-health-center-excellence/software-medical-device-samd"}, {"title": "FDA: Artificial Intelligence-Enabled Medical Devices", "url": "https://www.fda.gov/medical-devices/software-medical-device-samd/artificial-intelligence-enabled-medical-devices"}]}, "15-M3.3": {"what": "服务机器人安全标准规定了与人近距离互动的机器人的风险评估与安全要求，ISO 13482 针对个人护理机器人（移动服务机器人、身体辅助机器人、载人机器人等类型）；标准原文需通过 ISO 或国家标准机构获取，以最新版本为准。", "ask": ["个人护理机器人与工业机器人在安全要求上有何不同？", "风险评估一般包括哪些步骤？", "在公共或家庭空间运行的移动机器人有哪些主要风险？"], "read": [{"title": "Salvini, Paez-Granados & Billard, On the Safety of Mobile Robots Serving in Public Spaces（2021）", "url": "https://doi.org/10.1145/3442678"}, {"title": "Haddadin et al., Robot Collisions: A Survey on Detection, Isolation, and Identification", "url": "https://doi.org/10.1109/TRO.2017.2723903"}]}, "15-M3.4": {"what": "WCAG 是 W3C 发布的网页内容无障碍指南，以可感知、可操作、可理解、健壮四项原则组织；适老化改造可以参考 WCAG 以及国内相关适老化标准（以最新版本为准）。", "ask": ["WCAG 的四项原则分别是什么？", "符合级别 A、AA、AAA 有何区别？", "适老化改造除了放大字体，还应关注哪些方面？"], "read": [{"title": "W3C: Web Content Accessibility Guidelines (WCAG) 2.2（以最新版本为准）", "url": "https://www.w3.org/TR/WCAG22/"}, {"title": "W3C WAI: Older Users and Web Accessibility", "url": "https://www.w3.org/WAI/older-users/"}]}, "16-M1.1": {"what": "养老机器人按功能可分为陪伴社交、生活辅助、康复训练、护理移位和巡检监测等类别；不同类别在技术难度、安全风险、监管要求和成熟度上差别很大。", "ask": ["各类养老机器人分别面向什么需求？", "哪类机器人与人有物理接触？这意味着什么额外要求？", "为什么陪伴类机器人往往比物理辅助类更早落地？"], "read": [{"title": "Broekens, Heerink & Rosendal, Assistive social robots in elderly care: a review", "url": "https://doi.org/10.4017/gt.2009.08.02.002.00"}, {"title": "PARO 治疗型海豹机器人（AIST 介绍页）", "url": "https://unit.aist.go.jp/hiiri/topics/03-en.html"}]}, "16-M1.2": {"what": "本树采用“安全 > 健康 > 便利 > 陪伴”作为排序需求的思考框架：首先避免伤害（跌倒、误服、机器人碰撞），再支持健康管理，然后提升便利，最后是陪伴与情感需求。它是辅助取舍的经验框架，不是固定规则。", "ask": ["为什么安全需求应优先于便利与陪伴？", "举一个“便利功能引入新安全风险”的例子。", "老人自己的优先级与家属、机构的优先级可能有何不同？"], "read": [{"title": "WHO: Falls（事实清单）", "url": "https://www.who.int/news-room/fact-sheets/detail/falls"}, {"title": "WHO: Integrated care for older people（ICOPE）指南", "url": "https://www.who.int/publications/i/item/9789241550109"}]}, "16-M1.3": {"what": "复盘已有养老产品时，可以从目标用户与场景、真实使用率与流失原因、照护流程的融合程度、成本与付费方、安全事件和证据质量等方面系统分析成功与失败案例。", "ask": ["为什么很多演示效果好的产品在真实场景中使用率低？", "复盘时应收集哪些一手资料？", "谁为产品付费、谁使用产品，这一区别会带来什么问题？"], "read": [{"title": "Skivington et al., A new framework for developing and evaluating complex interventions（MRC 框架，BMJ 2021）", "url": "https://doi.org/10.1136/bmj.n2061"}, {"title": "Broekens, Heerink & Rosendal, Assistive social robots in elderly care: a review", "url": "https://doi.org/10.4017/gt.2009.08.02.002.00"}]}, "16-M2.1": {"what": "用药提醒告诉老人“该吃药了”，服药确认则判断“是否真的吃了”；确认可借助视觉识别、智能药盒开盖记录或语音应答，但每种方式都只能提供间接证据。", "ask": ["提醒与确认解决的分别是哪类依从性问题？", "视觉确认服药可能有哪些误判和隐私问题？", "漏服时应该提醒谁、如何升级通知？"], "read": [{"title": "Osterberg & Blaschke, Adherence to Medication（NEJM 2005）", "url": "https://doi.org/10.1056/NEJMra050100"}, {"title": "MSD Manual: Adherence to a Medication Regimen", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/factors-affecting-response-to-medications/adherence-to-a-medication-regimen"}]}, "16-M2.2": {"what": "智能药盒按时间分格、自动分药或记录开盖时间，用于减少错服和发现漏服；分装环节本身也可能出错，需要药师或照护者复核。", "ask": ["自动分药和人工分装各有哪些出错点？", "智能药盒的数据能说明什么，不能说明什么？", "如何为视力或手部功能差的老人设计药盒？"], "read": [{"title": "Osterberg & Blaschke, Adherence to Medication（含电子监测的讨论）", "url": "https://doi.org/10.1056/NEJMra050100"}, {"title": "MSD Manual: Medication Errors", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/concepts-in-pharmacotherapy/medication-errors"}]}, "16-M2.3": {"what": "自动化药房系统（自动发药、自动分包、智能药柜）和机构内配送机器人可减少人工调配差错和重复劳动，但需要重新设计流程，并处理故障和例外情况。", "ask": ["自动化发药系统主要减少哪些类型的差错？", "引入自动化后可能出现哪些新的差错类型？", "机构内配送机器人需要与哪些人员和系统协同？"], "read": [{"title": "Batson et al., Automation of in-hospital pharmacy dispensing: a systematic review（2020）", "url": "https://doi.org/10.1136/ejhpharm-2019-002081"}, {"title": "WHO: Medication Without Harm", "url": "https://www.who.int/initiatives/medication-without-harm"}]}, "16-M2.4": {"what": "机器人取药递药需要识别正确药品、可靠抓取，并把物品安全地交到人手中；人机交接涉及时机、位置、握力释放和对人意图的判断，对老年人尤其需要慢速与柔顺。", "ask": ["人机交接中，机器人何时应松手？", "识别药品时为什么不能只依靠外观？", "面对手部颤抖或反应较慢的老人，交接策略要如何调整？"], "read": [{"title": "Ortenzi et al., Object Handovers: A Review for Robotics（IEEE TRO 2021）", "url": "https://doi.org/10.1109/TRO.2021.3075365"}, {"title": "Sundermeyer et al., Contact-GraspNet", "url": "https://arxiv.org/abs/2103.14127"}]}, "16-M2.5": {"what": "规则引擎可把 PIM 标准和药物相互作用知识编码为可追溯的检查规则；大语言模型适合把结果解释成通俗语言，但可能产生错误信息，因此结论应以规则和专业人员审核为准，并明确提示咨询医生或药师。", "ask": ["为什么用药结论不应只依赖大语言模型生成？", "规则引擎与 LLM 应如何分工？", "LLM 用药问答应设置哪些安全边界和拒答场景？"], "read": [{"title": "American Geriatrics Society, 2023 Updated AGS Beers Criteria", "url": "https://doi.org/10.1111/jgs.18372"}, {"title": "Singhal et al., Large language models encode clinical knowledge（Nature 2023）", "url": "https://doi.org/10.1038/s41586-023-06291-2"}]}, "16-M3.1": {"what": "跌倒检测可基于可穿戴设备、环境传感器（雷达、压力、振动）或视觉；系统需要在误报与漏报之间权衡，并设计好报警后的响应流程。检测不能替代跌倒预防。", "ask": ["三类跌倒检测方案各有哪些优缺点？", "误报过多会对照护造成什么影响？", "老人跌倒后长时间无法起身为什么危险？"], "read": [{"title": "Mubashir, Shao & Seed, A survey on fall detection: Principles and approaches", "url": "https://doi.org/10.1016/j.neucom.2011.09.037"}, {"title": "MSD Manual: Falls in Older Adults", "url": "https://www.msdmanuals.com/professional/geriatrics/falls-in-older-adults/falls-in-older-adults"}]}, "16-M3.2": {"what": "夜间是跌倒和突发事件的高风险时段；监测离床、夜间如厕和睡眠模式变化可以帮助发现风险，但睡眠指标需结合临床背景解读，不宜过度解读消费级设备数据。", "ask": ["夜间离床监测在养老机构中的常见用途是什么？", "失眠与镇静催眠药使用之间有什么值得关注的关系？", "消费级设备的睡眠指标有哪些局限？"], "read": [{"title": "MSD Manual: Insomnia and Excessive Daytime Sleepiness", "url": "https://www.msdmanuals.com/professional/neurologic-disorders/sleep-and-wakefulness-disorders/insomnia-and-excessive-daytime-sleepiness-eds"}, {"title": "Majumder, Mondal & Deen, Wearable Sensors for Remote Health Monitoring", "url": "https://doi.org/10.3390/s17010130"}]}, "16-M3.3": {"what": "生命体征趋势分析关注个体相对自身基线的变化，而非单次测量；早期预警评分（如 NEWS2）把多项生命体征综合为风险提示，居家使用时需要明确响应流程与数据质量要求。", "ask": ["为什么个体基线变化比人群阈值更有意义？", "早期预警评分包括哪些生命体征？", "居家测量的数据质量问题如何处理？"], "read": [{"title": "Royal College of Physicians: National Early Warning Score (NEWS) 2", "url": "https://www.rcp.ac.uk/improving-care/resources/national-early-warning-score-news-2/"}, {"title": "Majumder, Mondal & Deen, Wearable Sensors for Remote Health Monitoring", "url": "https://doi.org/10.3390/s17010130"}]}, "16-M3.4": {"what": "数字生物标志物利用手机、可穿戴设备或日常行为数据（如步态、打字、说话、活动模式）尝试发现认知衰退迹象；目前多处于研究阶段，需审慎解读并避免造成不必要的焦虑。", "ask": ["有哪些日常行为数据被研究用于发现认知衰退？", "为什么研究阶段的指标不能直接用于诊断？", "向老人和家属反馈此类结果时应注意什么？"], "read": [{"title": "Kourtis et al., Digital biomarkers for Alzheimer's disease: the mobile/wearable devices opportunity（2019）", "url": "https://doi.org/10.1038/s41746-019-0084-2"}, {"title": "Livingston et al., Dementia prevention, intervention, and care: 2024 report of the Lancet standing Commission", "url": "https://doi.org/10.1016/S0140-6736(24)01296-0"}]}, "16-M4.1": {"what": "陪伴机器人与对话智能体通过记忆个人信息、个性化对话和情感回应提供陪伴与支持；需要关注依赖、欺骗感、隐私和替代真人关怀等伦理问题。", "ask": ["对话智能体的“记忆”功能能带来哪些好处与风险？", "如何让陪伴技术促进而不是替代人际交往？", "对话中出现情绪危机或健康风险信号时，系统应如何处理？"], "read": [{"title": "Broekens, Heerink & Rosendal, Assistive social robots in elderly care: a review", "url": "https://doi.org/10.4017/gt.2009.08.02.002.00"}, {"title": "Sharkey & Sharkey, Granny and the robots: ethical issues in robot care for the <script>
const T = JSON.parse(document.getElementById('tree-data').textContent);
const $ = s => document.querySelector(s);

// ---------- 个人进度（与公共内容分离）----------
// 默认存浏览器 localStorage；可导出 / 导入 JSON（建议存为 progress/personal.local.json，已被 .gitignore 排除）。
// 私有构建（export-dashboard.py --progress FILE）会把该文件内嵌为种子，仅在本机还没有进度时采用。
const LS_KEY = 'pe-eldercare-tree:progress:v1';
const emptyProgress = () => ({ schema: 'pe-eldercare-tree-progress', version: 1, updated: null, done: {}, notes: {} });
function normalize(o) {
  const p = emptyProgress();
  if (o && typeof o === 'object') {
    if (o.done && typeof o.done === 'object') for (const k in o.done) if (o.done[k]) p.done[k] = true;
    if (o.notes && typeof o.notes === 'object') for (const k in o.notes) if (typeof o.notes[k] === 'string' && o.notes[k].trim()) p.notes[k] = o.notes[k];
    p.updated = o.updated || null;
  }
  return p;
}
let P = emptyProgress(), storageOK = true, progressSource = '本机浏览器';
try {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) P = normalize(JSON.parse(raw));
  else {
    const seed = JSON.parse(document.getElementById('progress-seed').textContent || 'null');
    if (seed) { P = normalize(seed); progressSource = '内嵌的私有进度文件'; }
  }
} catch (e) { storageOK = false; }
function save() {
  P.updated = new Date().toISOString();
  try { localStorage.setItem(LS_KEY, JSON.stringify(P)); } catch (e) { storageOK = false; }
}
const isDone = k => !!P.done[k];
function toggleDone(k) { if (P.done[k]) delete P.done[k]; else P.done[k] = true; save(); render(); }
function editNote(k, label) {
  const v = prompt('「' + label + '」的个人笔记（只保存在本机 / 你导出的 JSON 里；留空即删除）：', P.notes[k] || '');
  if (v === null) return;
  if (v.trim()) P.notes[k] = v; else delete P.notes[k];
  save(); render();
}
function exportProgress() {
  const blob = new Blob([JSON.stringify(Object.assign({}, P, { exported: new Date().toISOString() }), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'personal.local.json';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function importProgress(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const inc = normalize(JSON.parse(r.result));
      Object.assign(P.done, inc.done); Object.assign(P.notes, inc.notes);
      save(); progressSource = '已导入 ' + file.name; render();
      alert('已导入：' + Object.keys(inc.done).length + ' 个完成项、' + Object.keys(inc.notes).length + ' 条笔记（与本机进度合并）');
    } catch (e) { alert('导入失败：不是有效的进度 JSON'); }
  };
  r.readAsText(file);
}
const ck = (k) => `<input type="checkbox" class="ck" data-done="${esc(k)}" ${isDone(k) ? 'checked' : ''} title="标记为已完成（个人进度）">`;
const noteBtn = (k, label) => `<button class="note-btn ${P.notes[k] ? 'has' : ''}" data-note="${esc(k)}" data-label="${esc(label)}" title="个人笔记">✎</button>`;
const noteText = k => P.notes[k] ? `<span class="note">✎ ${esc(P.notes[k])}</span>` : '';

// ---------- 节点索引：id/url -> 位置 ----------
const idx = {};
function reg(key, type, c, m, p) { if (key) idx[key] = { type, c, m, p }; }
T.chapters.forEach((ch, c) => ch.modules.forEach((mo, m) => mo.points.forEach((pt, p) => {
  reg(ch.id + '-' + pt.id, 'theory', c, m, p);
  reg(pt.id, 'theory', c, m, p); // 章内简写
})));
// 叶子分组：树根 → 各篇章（理论地图顺序）→ 野生
const chaptersById = {}; T.chapters.forEach(ch => chaptersById[ch.id] = ch.name);
const LEAF_GROUPS = [];
(function () {
  const byKey = {};
  T.leaves.forEach(l => {
    const k = l.anchor === 'root' || l.anchor === 'wild' ? l.anchor : l.anchor.split('-')[0];
    (byKey[k] = byKey[k] || []).push(l);
  });
  const names = { root: '树根 · 基础工具', wild: '野生叶子' };
  ['root', ...T.chapters.map(c => c.id), 'wild'].forEach(k => {
    if (byKey[k]) LEAF_GROUPS.push({ key: k, name: names[k] || (k + ' · ' + (chaptersById[k] || '')), opt: k === 'wild', items: byKey[k] });
  });
})();
LEAF_GROUPS.forEach((g, gi) => g.items.forEach((l, i) => reg(l.id, 'list', gi, null, i)));

T.cards.forEach((cd, i) => reg(cd.id, 'card', i));

// 卡片 ↔ 叶子（同站点口径：卡片 target/next 与叶子 id/anchor/tags 相交即相关）
function cardHits(c, l) {
  const keys = new Set([c.target, ...c.next]);
  return keys.has(l.id) || keys.has(l.anchor) || l.tags.some(t => keys.has(t));
}
const cardsByLeafId = {}, orphanCards = {};
T.leaves.forEach(l => {
  const cs = T.cards.filter(c => cardHits(c, l));
  if (cs.length) cardsByLeafId[l.id] = cs;
});
// 兜底：既没挂到任何叶子、target/next 也不指向任何学习点的卡片，才放进叶子清单分组底部（正常情况下应为空——
// 卡片已直接展示在其挂载的学习点下方）
T.cards.forEach(c => {
  const hasPoint = [c.target, ...c.next].some(r => /^\d{2}-M\d+\.\d+$/.test(r));

});

// 理论点 ← 叶子/卡片（反向引用，与网页版 TheoryMap 同口径）：叶子的 anchor 或 tags 指向点编号
// 即挂在本枝节；卡片的 target/next 指向点编号即计入
const PT_RE = /^\d{2}-M\d+\.\d+$/;
const leavesByPoint = {}, cardIdsByPoint = {};
T.leaves.forEach(l => {
  const pts = new Set();
  if (PT_RE.test(l.anchor)) pts.add(l.anchor);
  l.tags.forEach(t => { if (PT_RE.test(t)) pts.add(t); });
  pts.forEach(pid => { (leavesByPoint[pid] = leavesByPoint[pid] || []).push(l); });
});
T.cards.forEach(c => {
  const seen = new Set();
  [c.target, ...c.next].forEach(r => {
    if (PT_RE.test(r) && !seen.has(r)) {
      seen.add(r);
      (cardIdsByPoint[r] = cardIdsByPoint[r] || []).push(c.id);
    }
  });
});

const esc = s => (s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const stars = n => '★'.repeat(n) + '<span style="opacity:.25">' + '★'.repeat(Math.max(0, 3 - n)) + '</span>';
const chev = '<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 6l6 6-6 6"/></svg>';

let cur = 0, query = '';
const TABS = [
  { key: 'theory', name: '理论地图' },
  { key: 'list', name: '叶子清单' },
  { key: 'inbox', name: '收集箱' },
  { key: 'cards', name: '学习卡片' },
];
const count = { theory: T.chapters.reduce((n, c) => n + c.modules.reduce((k, m) => k + m.points.length, 0), 0),
  list: T.leaves.length, inbox: T.inbox.length, cards: T.cards.length };
// 手风琴展开状态：理论地图篇章 / 叶子清单分组
const openCh = new Set(), openGrp = new Set(['root']), openPt = new Set();
const GUIDES = T.guides || {}, ROUTES = T.routes || {};
const ptName = {}; T.chapters.forEach(ch => ch.modules.forEach(mo => mo.points.forEach(pt => ptName[ch.id + '-' + pt.id] = pt.name)));
// 某学习点挂着的卡片：① target 直挂 ② next 引用 ③ 经本点叶子关联（卡片 target/next 指向本点的某片叶子）
function cardsForPoint(key, here) {
  const out = [], seen = new Set();
  const push = (c, rel) => { if (!seen.has(c.id)) { seen.add(c.id); out.push({ c, rel }); } };
  T.cards.filter(c => c.target === key).forEach(c => push(c, '直挂'));
  T.cards.filter(c => c.next.includes(key)).forEach(c => push(c, '相关'));
  const leafIds = new Set(here.map(l => l.id));
  T.cards.filter(c => leafIds.has(c.target) || c.next.some(n => leafIds.has(n))).forEach(c => push(c, '经叶子'));
  return out;
}
function pointDetail(key, here) {
  const g = GUIDES[key];
  const cs = cardsForPoint(key, here);
  const guideHtml = g ? `
    <div class="sec"><b>学什么</b>${esc(g.what)}</div>
    <div class="sec"><b>学完能回答</b><ol>${g.ask.map(a => `<li>${esc(a)}</li>`).join('')}</ol></div>
    <div class="sec"><b>入门阅读</b><ul>${g.read.map(r => `<li><a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.title)} ↗</a></li>`).join('')}</ul></div>`
    : '<div class="sec muted">这个学习点的「学什么 / 自检问题 / 入门阅读」还没写（目前试点只覆盖 05 篇章）。</div>';
  const cardsHtml = cs.length ? `<div class="sec"><b>学习卡片 · ${cs.length}</b>${cs.map(({ c, rel }) => `
      <div class="mini">${ck(c.id)}<span class="rel ${rel === '直挂' ? 'direct' : ''}">${rel}</span>
        <a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.name)} ↗</a>
        ${c.date ? `<span class="badge">${esc(c.date)}</span>` : ''}
        <span class="muted">${c.tags.map(esc).join(' · ')}</span>
        <span class="badge node" data-go="${esc(c.id)}" title="在学习卡片板块查看">卡片详情</span>
        ${c.def ? `<span class="cdef"><b>是什么</b>${esc(c.def)}</span>` : ''}
        ${c.use ? `<span class="cdef"><b>怎么用</b>${esc(c.use)}</span>` : ''}</div>`).join('')}</div>` : '';
  const leavesHtml = here.length ? `<div class="sec"><b>叶子（项目 / 练习）· ${here.length}</b>${here.map(l => `
      <div class="mini">${ck(l.id)}${l.url ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>` : `<span>✎ ${esc(l.name)}</span><span class="badge">练习</span>`}
        <span class="muted">${esc(l.intro)}</span></div>`).join('')}</div>` : '';
  return `<div class="pt-detail">${guideHtml}${cardsHtml}${leavesHtml}</div>`;
}
function nodeBadge(key) {
  if (!key) return '';
  if (idx[key]) return `<span class="badge node" data-go="${esc(key)}" title="跳转到 ${esc(key)}">${esc(key)}</span>`;
  return `<span class="badge broken" title="树上没有此节点——断链">${esc(key)}</span>`;
}
function match(...fields) { const q = query.toLowerCase(); return !q || fields.some(f => (f || '').toLowerCase().includes(q)); }

function renderTabs() {
  $('#tabs').innerHTML = TABS.map((t, i) =>
    `<button class="tab" role="tab" aria-selected="${i === cur}" data-tab="${i}">${t.name}<span class="cnt">${count[t.key]}</span></button>`).join('');
  const ptKeys = []; T.chapters.forEach(ch => ch.modules.forEach(mo => mo.points.forEach(pt => ptKeys.push(ch.id + '-' + pt.id))));
  const dPt = ptKeys.filter(isDone).length, dLf = T.leaves.filter(l => isDone(l.id)).length, dCd = T.cards.filter(c => isDone(c.id)).length;
  $('#stats').innerHTML = [
    ['篇章', T.chapters.length], ['学习点', `${dPt}/${count.theory}`], ['叶子', `${dLf}/${count.list}`],
    ['收集箱', count.inbox], ['卡片', `${dCd}/${count.cards}`], ['笔记', Object.keys(P.notes).length],
  ].map(([k, v]) => `<span class="stat"><b>${v}</b>${k}</span>`).join('');
  $('#pbar').style.width = (count.theory ? (100 * dPt / count.theory) : 0).toFixed(1) + '%';
  $('#meta').textContent = '生成于 ' + T.generated + ' · 内容只读；勾选与笔记 = 个人进度';
  $('#psrc').textContent = storageOK ? ('进度来源：' + progressSource + (P.updated ? ' · 最后更新 ' + new Date(P.updated).toLocaleString() : '')) : '⚠ 浏览器禁止 localStorage：请定期导出 JSON';
}

const DOMAIN = { '00': '公共基础', '01': '药学', '06': '具身智能', '12': '养老', '16': '交叉应用' };
function panelTheory() {
  return T.chapters.map((ch, c) => {
    const chHit = match(ch.name, ch.summary, ch.p0);
    const modsHtml = ch.modules.map((mo, m) => {
      const rows = mo.points.map((pt, p) => ({ pt, p })).filter(({ pt }) =>
        chHit || match(pt.name, pt.id, ch.id + '-' + pt.id, (GUIDES[ch.id + '-' + pt.id] || {}).what)).map(({ pt, p }) => {
        const key = ch.id + '-' + pt.id;
        const here = leavesByPoint[key] || [];
        const chips = here.length ? `<span class="chips">${here.map(l => l.url
          ? `<span class="badge leafy node" data-go="${esc(l.id)}" title="叶子：${esc(l.intro)}，点击在叶子清单定位">${esc(l.name)} ↗</span>`
          : `<span class="badge dash" title="练习项：${esc(l.intro)}">✎ ${esc(l.name)}</span>`).join('')}</span>` : '';
        const leafCnt = here.length ? `<span class="cnt leafy" data-go="${esc(here[0].id)}" title="${here.length} 片叶子长在本枝节，点击在叶子清单定位">叶 ${here.length}</span>` : '';
        const nCards = cardsForPoint(key, here).length;
        const cardCnt = nCards ? `<span class="cnt cardy" data-pt="${esc(key)}" title="${nCards} 张学习卡片挂在本点，点击展开">卡 ${nCards}</span>` : '';
        const isOpen = openPt.has(key) || (query && GUIDES[key] && match(GUIDES[key].what));
        return `
        <div class="pt ${isDone(key) ? 'is-done' : ''} ${isOpen ? 'open' : ''}" id="th-${c}-${m}-${p}">
          <button class="tg" data-pt="${esc(key)}" title="展开：学什么 + 卡片 + 叶子">${chev}</button>
          ${ck(key)}<span class="id">${ch.id}-${pt.id}</span><span class="nm"><span class="pname" data-pt="${esc(key)}">${esc(pt.name)}</span>${GUIDES[key] ? '<span class="gmark">指引</span>' : ''}${isOpen ? '' : chips}${noteText(key)}</span>
          <span>${stars(pt.freq)}</span>${leafCnt}${cardCnt}${noteBtn(key, pt.name)}
        </div>${isOpen ? pointDetail(key, here) : ''}`;
      }).join('');
      return rows ? `<div class="mod"><h4>${esc(mo.name)}</h4>${rows}</div>` : '';
    }).join('');
    if (query && !modsHtml) return '';
    const total = ch.modules.reduce((n, mo) => n + mo.points.length, 0);
    const doneN = ch.modules.reduce((n, mo) => n + mo.points.filter(pt => isDone(ch.id + '-' + pt.id)).length, 0);
    const open = query ? true : openCh.has(ch.id);
    return `${!query && DOMAIN[ch.id] ? `<div class="domain">${DOMAIN[ch.id]}</div>` : ''}<details class="ch" data-ch="${ch.id}" ${open ? 'open' : ''}>
      <summary>${chev}<span>${ch.id} · ${esc(ch.name)}</span><span class="stars">${'★'.repeat(ch.weight)}</span>
        <span class="sum">${esc(ch.summary)}</span><span class="n">${doneN}/${total} 点</span></summary>
      <div class="ch-body">
        ${ROUTES[ch.id] && !query ? `<div class="route"><b>学习路线</b>（按顺序学，点击展开该学习点）<ol>${ROUTES[ch.id].map(k =>
          `<li class="${isDone(k) ? 'done' : ''}" data-pt="${esc(k)}" data-scroll="1" title="${esc(k)}">${esc(ptName[k] || k)}${isDone(k) ? ' ✓' : ''}</li>`).join('')}</ol></div>` : ''}
        ${ch.p0 ? `<p class="p0">优先学习配方：${esc(ch.p0)}</p>` : ''}
        ${modsHtml}
      </div>
    </details>`;
  }).join('') || '<div class="empty">没有匹配的学习点</div>';
}

function panelList() {
  return LEAF_GROUPS.map((g, gi) => {
    const items = g.items.filter(it => match(it.name, it.intro, it.id, it.anchor, it.tags.join(' '))).map((it, i) => `
      <div class="leaf ${isDone(it.id) ? 'is-done' : ''}" id="li-${gi}-${i}">
        ${ck(it.id)}<span style="flex:1;min-width:0">
          <span class="nm">${it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.name)} ↗</a>` : esc(it.name)}</span>
          ${it.practice ? '<span class="badge">练习</span>' : ''}
          ${it.opt ? '<span class="badge">支线</span>' : ''}
          <span class="intro"> — ${esc(it.intro)}</span>
          ${(cardsByLeafId[it.id] || []).map(c => `<span class="badge leafy node" data-go="${esc(c.id)}" title="学习卡片「${esc(c.name)}」，点击跳转">${esc(c.name)}</span>`).join(' ')}
          ${noteText(it.id)}
        </span>${noteBtn(it.id, it.name)}
        ${it.anchor.includes('-') ? nodeBadge(it.anchor) : ''}
      </div>`).join('');
    if (query && !items) return '';
    const orphans = orphanCards[g.key] || [];
    const orphanLine = orphans.length && !query ? `
      <p class="orphan">未挂到学习点或叶子的卡片（兜底）：
        ${orphans.map(c => `<span class="badge leafy node" data-go="${esc(c.id)}">${esc(c.name)}</span>`).join(' ')}</p>` : '';
    const open = query ? true : openGrp.has(g.key);
    return `<details class="ch grp" data-grp="${g.key}" ${open ? 'open' : ''}>
      <summary>${chev}<span>${esc(g.name)}</span>${g.opt ? '<span class="badge">支线</span>' : ''}
        <span class="n">${g.items.filter(x => isDone(x.id)).length}/${g.items.length} 片</span></summary>
      <div class="ch-body">
        ${g.key === 'wild' ? '<p class="gnote">已进树但未落户：树还没长出对应枝干，长出后移入正式分组。</p>' : ''}
        ${items}${orphanLine}
      </div>
    </details>`;
  }).join('') || '<div class="empty">没有匹配的叶子</div>';
}

function panelInbox() {
  return T.inbox.filter(it => match(it.name, it.intro, it.cat, it.concept)).map((it, i) => `
    <div class="cardx" id="ib-${i}">
      <h3><a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.name)} ↗</a>
        <span class="badge ${it.kind === 'twig' ? 'kind-twig' : 'leafy'}">${it.kind === 'twig' ? '新枝节' : '新叶子'}</span>
        <span class="badge lv-${esc(it.level)}">${esc(it.level)}</span>
        ${it.graduated ? `<span class="badge grad">已毕业 ${esc(it.graduated)}</span>` : ''}</h3>
      <div class="sub">${esc(it.cat)} · 收录于 ${esc(it.added)}</div>
      <div class="kv"><b>是什么</b><span>${esc(it.intro)}</span></div>
      <div class="kv"><b>为什么收</b><span>${esc(it.why)}</span></div>
      <div class="kv"><b>怎么下潜</b><span>${esc(it.dive)}</span></div>
      ${it.concept ? `<div class="kv"><b>新概念</b><span>${esc(it.concept)}（待入理论线）</span></div>` : ''}
    </div>`).join('') || '<div class="empty">没有匹配的收集箱条目</div>';
}

function panelCards() {
  return T.cards.map((cd, i) => ({ cd, i })).filter(({ cd }) => match(cd.name, cd.tags.join(' '), cd.target, cd.def, cd.use)).map(({ cd, i }) => {
    const relLeaves = T.leaves.filter(l => cardHits(cd, l));
    return `
    <div class="cardx ${isDone(cd.id) ? 'is-done' : ''}" id="cd-${i}">
      <h3>${ck(cd.id)}<a href="${esc(cd.url)}" target="_blank" rel="noopener">${esc(cd.name)} ↗</a>
        ${cd.date ? `<span class="badge">${esc(cd.date)}</span>` : ''}
        ${cd.madeBy ? `<span class="badge">${esc(cd.madeBy)}</span>` : ''}${noteBtn(cd.id, cd.name)}</h3>
      ${noteText(cd.id)}
      <div class="sub">挂载点 ${nodeBadge(cd.target)}</div>
      ${cd.def ? `<div class="kv"><b>是什么</b><span>${esc(cd.def)}</span></div>` : ''}
      ${cd.use ? `<div class="kv"><b>怎么用</b><span>${esc(cd.use)}</span></div>` : ''}
      <div class="kv"><b>技术栈</b><span class="tags">${cd.tags.map(t => `<span class="badge">${esc(t)}</span>`).join('')}</span></div>
      ${relLeaves.length ? `<div class="kv"><b>相关叶子</b><span>${relLeaves.map(l => l.url
        ? `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.name)} ↗</a>`
        : `<span class="badge node" data-go="${esc(l.id)}">${esc(l.name)}</span>`).join('　')}</span></div>` : ''}
      <div class="kv"><b>接下来</b><span>${cd.next.map(n => nodeBadge(n)).join(' ') || '—'}</span></div>
    </div>`;
  }).join('') || '<div class="empty">没有匹配的卡片</div>';
}

const panels = { theory: panelTheory, list: panelList, inbox: panelInbox, cards: panelCards };
const panelEl = { theory: 'th', list: 'li', inbox: 'ib', cards: 'cd' };
const TAB_INDEX = { theory: 0, list: 1, inbox: 2, card: 3 };

function render() {
  renderTabs();
  $('#main').innerHTML = panels[TABS[cur].key]();
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { cur = +b.dataset.tab; render(); });
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  document.querySelectorAll('[data-done]').forEach(b => b.onchange = () => toggleDone(b.dataset.done));
  document.querySelectorAll('[data-pt]').forEach(b => b.onclick = () => togglePt(b.dataset.pt, !!b.dataset.scroll));
  document.querySelectorAll('[data-note]').forEach(b => b.onclick = () => editNote(b.dataset.note, b.dataset.label));
  // 手风琴状态写回（搜索时强制展开，不记状态）
  document.querySelectorAll('details.ch[data-ch]').forEach(d =>
    d.ontoggle = () => { if (!query) { d.open ? openCh.add(d.dataset.ch) : openCh.delete(d.dataset.ch); } });
  document.querySelectorAll('details.ch[data-grp]').forEach(d =>
    d.ontoggle = () => { if (!query) { d.open ? openGrp.add(d.dataset.grp) : openGrp.delete(d.dataset.grp); } });
}

function togglePt(key, scroll) {
  if (scroll) openPt.add(key); else if (openPt.has(key)) openPt.delete(key); else openPt.add(key);
  const t = idx[key];
  render();
  if (scroll && t) { const el = document.getElementById(`th-${t.c}-${t.m}-${t.p}`); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }
}
function go(key, fromHash) {
  const t = idx[key];
  if (!t) return;
  if (t.type === 'theory') { openCh.add(T.chapters[t.c].id); openPt.add(T.chapters[t.c].id + '-' + T.chapters[t.c].modules[t.m].points[t.p].id); }
  if (t.type === 'list') openGrp.add(LEAF_GROUPS[t.c].key);
  cur = TAB_INDEX[t.type];
  render();
  const el = document.getElementById(`${panelEl[TABS[cur].key]}-${t.c}${t.m == null ? '-' + t.p : '-' + t.m + '-' + t.p}`);
  if (el) { el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('hl'); setTimeout(() => el.classList.remove('hl'), 1600); }
  if (!fromHash) history.replaceState(null, '', '#' + encodeURIComponent(key));
}

$('#q').addEventListener('input', e => { query = e.target.value.trim(); render(); });
$('#btn-export').onclick = exportProgress;
$('#btn-import').onclick = () => $('#file-import').click();
$('#file-import').onchange = e => { if (e.target.files[0]) importProgress(e.target.files[0]); e.target.value = ''; };
$('#btn-clear').onclick = () => { if (confirm('清空本浏览器里的全部进度与笔记？建议先导出 JSON 备份。')) { P = emptyProgress(); save(); render(); } };
$('#starters').innerHTML = (T.starters || []).map(s => `<div class="starter"><b>${esc(s.who)}</b>${esc(s.desc)}<ol>${s.steps.map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>`).join('');
// URL 参数：?expand=all 展开全部篇章；?tab=0..3 选择板块；?starters=1 展开入口路径（便于截图 / 分享）
const QS = new URLSearchParams(location.search);
if (QS.get('expand') === 'all') T.chapters.forEach(ch => openCh.add(ch.id));
else if (QS.get('expand')) QS.get('expand').split(',').forEach(id => openCh.add(id));
// ?open=05-M1.1,05-M3.1 展开指定学习点（并自动展开其篇章）
if (QS.get('open')) QS.get('open').split(',').forEach(k => { openPt.add(k); openCh.add(k.split('-')[0]); });
if (QS.get('tab')) cur = Math.max(0, Math.min(3, +QS.get('tab') || 0));
if (QS.get('starters') === '1') $('#starters-box').open = true;
render();
// 深链 #节点id：只在载入时处理一次（之前放在 render 里会与 go→render 互相递归）
if (location.hash.length > 1) go(decodeURIComponent(location.hash.slice(1)), true);
</script>
</body>
</html>

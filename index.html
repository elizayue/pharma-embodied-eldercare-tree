 "cat": "AIDD 结构预测 · 05-M3", "intro": "开源的生物分子复合物结构预测模型。", "why": "可作为复合物结构预测的开源替代来对照学习，与 AlphaFold 3 卡片同主题。", "dive": "先读 README 跑官方示例，对比 AlphaFold 3 的输入输出设计即可。", "level": "观望", "concept": null, "graduated": null}, {"name": "Genesis", "url": "https://genesis-embodied-ai.github.io/", "kind": "leaf", "added": "2026-10", "cat": "仿真平台 · 11-M1", "intro": "面向机器人与具身 AI 的开源物理仿真平台。", "why": "与 MuJoCo / Isaac Lab 同类，可在选择仿真器时横向比较。", "dive": "看官方文档的快速开始，跑一个机械臂示例，比较上手成本与速度。", "level": "观望", "concept": null, "graduated": null}, {"name": "ProteinMPNN", "url": "https://github.com/dauparas/ProteinMPNN", "kind": "twig", "added": "2026-10", "cat": "AIDD 生成式设计 · 05-M4.3", "intro": "给定蛋白骨架设计氨基酸序列的深度学习方法。", "why": "与 RFdiffusion 组成“先生成骨架、再设计序列”的常见蛋白设计流程。", "dive": "读论文摘要与 README，理解输入（骨架）与输出（序列），不必深入训练细节。", "level": "观望", "concept": null, "graduated": null}, {"name": "WHO ICOPE（老年人整合照护）", "url": "https://www.who.int/health-topics/ageing", "kind": "twig", "added": "2026-10", "cat": "野生枝节", "intro": "WHO 提出的以内在能力为核心的老年人整合照护框架。", "why": "可为“居家监测 + 社区照护”系统提供以功能为中心的评估视角，与 CGA 互补。", "dive": "在 WHO 网站检索 ICOPE 指南与手册，先读评估路径部分。", "level": "观望", "concept": "内在能力（Intrinsic Capacity）：认知、运动、活力、感官、心理五维功能储备——建议挂在 12-M3 或 14-M2", "graduated": null}], "cards": [{"id": "card-lipinski", "name": "Lipinski 五规则（Rule of 5）", "def": "Lipinski 等人基于大量进入临床研究的化合物统计提出的经验规则：分子量 > 500、logP > 5、氢键供体 > 5、氢键受体 > 10，超出其中两项及以上时，口服吸收或渗透差的可能性更大。", "use": "① 虚拟筛选 / 分子生成后的第一道类药性过滤；② 用 RDKit 计算分子量、logP、氢键供受体即可自查（见练习「用 RDKit 计算类药性指标」）；③ 只作参考：天然产物、转运体底物、新型药物模态常是例外。", "target": "01-M2.3", "url": "https://doi.org/10.1016/S0169-409X(96)00423-1", "tags": ["口服类药性", "分子量", "logP", "氢键供体 / 受体"], "next": ["leaf-p-lipinski", "02-M2.1", "05-M2.2"], "madeBy": "让模型帮忙", "date": "1997"}, {"id": "card-alphafold2", "name": "AlphaFold 2", "def": "DeepMind 的蛋白结构预测模型：输入氨基酸序列（及多序列比对），输出三维结构和每残基置信度 pLDDT、残基对误差 PAE。", "use": "① 靶点没有实验结构时得到结构模型，用于口袋分析与对接；② 先查 AlphaFold 蛋白结构数据库，查不到再用 ColabFold 自己跑；③ 只信任高 pLDDT 区域，低置信区域多为柔性或无序。", "target": "05-M3.1", "url": "https://www.nature.com/articles/s41586-021-03819-2", "tags": ["蛋白结构预测", "MSA", "Evoformer", "CASP14"], "next": ["card-alphafold3", "leaf-colabfold", "leaf-afdb"], "madeBy": "让模型帮忙", "date": "2021-07"}, {"id": "card-alphafold3", "name": "AlphaFold 3", "def": "DeepMind 与 Isomorphic Labs 的复合物结构预测模型，可预测蛋白与配体、核酸、离子等组成的复合物结构。", "use": "① 在 AlphaFold Server 在线提交复合物，获得结合模式假设（服务器支持的分子类型与用途受条款限制，用前阅读）；② 预测结果需用对接、物理合理性检查或实验进一步验证。", "target": "05-M3.2", "url": "https://www.nature.com/articles/s41586-024-07487-w", "tags": ["复合物结构", "扩散模块", "蛋白—配体", "蛋白—核酸"], "next": ["card-alphafold2", "card-diffdock", "01-M4.3", "leaf-afdb"], "madeBy": "让模型帮忙", "date": "2024-05"}, {"id": "card-esm2", "name": "ESM-2 / ESMFold", "def": "Meta 的蛋白语言模型系列：ESM-2 在大规模蛋白序列上自监督预训练；ESMFold 基于 ESM-2 表示，无需多序列比对即可从单条序列预测结构。", "use": "① 用 fair-esm 包或 Hugging Face 提取蛋白嵌入，作为 DTI、功能预测等任务的输入特征；② 用 ESMFold 快速批量预测结构，再与 AlphaFold 结果对照。", "target": "05-M1.2", "url": "https://github.com/facebookresearch/esm", "tags": ["蛋白语言模型", "单序列结构预测", "表示学习"], "next": ["card-alphafold2", "05-M3.1", "05-M2.3"], "madeBy": "让模型帮忙", "date": null}, {"id": "card-diffdock", "name": "DiffDock", "def": "把分子对接视为生成问题的扩散模型：在配体平移、旋转和扭转角上逐步去噪生成结合姿态，并用置信度模型给姿态排序。", "use": "① 输入蛋白结构 + 配体 SMILES，输出排序后的结合姿态，适合口袋未知的盲对接；② 结果用 PoseBusters 检查物理合理性，并与 AutoDock Vina 对照（见对接练习）。", "target": "05-M3.3", "url": "https://arxiv.org/abs/2210.01776", "tags": ["扩散模型", "盲对接", "姿态生成"], "next": ["leaf-diffdock", "leaf-vina", "leaf-p-dock"], "madeBy": "让模型帮忙", "date": "2022-10"}, {"id": "card-rfdiffusion", "name": "RFdiffusion", "def": "Baker 实验室基于 RoseTTAFold 结构预测网络改造的扩散模型，用于生成新的蛋白质骨架。", "use": "① 无条件骨架生成、基序支架（motif scaffolding）、结合蛋白设计；② 标准流程：RFdiffusion 生成骨架 → ProteinMPNN 设计序列 → AlphaFold 检查结构自洽，再进实验。", "target": "05-M4.3", "url": "https://www.nature.com/articles/s41586-023-06415-8", "tags": ["蛋白质从头设计", "扩散模型", "结合蛋白设计"], "next": ["leaf-rfdiffusion", "card-alphafold2", "05-M4.2"], "madeBy": "让模型帮忙", "date": "2023-07"}, {"id": "card-chemprop", "name": "Chemprop（D-MPNN）", "def": "基于有向消息传递神经网络（D-MPNN）的开源分子性质预测软件包。", "use": "① 准备「SMILES + 标签」的 CSV，命令行即可训练回归 / 分类模型；② 作为 QSAR / ADMET 任务的强基线，并可开启不确定性估计；③ 用 TDC 数据配合骨架划分评估泛化。", "target": "05-M2.1", "url": "https://github.com/chemprop/chemprop", "tags": ["消息传递网络", "性质预测", "不确定性"], "next": ["leaf-tdc", "05-M2.4", "leaf-p-scaffold"], "madeBy": "让模型帮忙", "date": null}, {"id": "card-tdc", "name": "TDC 基准", "def": "Therapeutics Data Commons：面向治疗学机器学习的数据集、任务与基准平台，提供 Python 包 PyTDC。", "use": "① 用几行代码加载 ADMET、DTI 等数据集，并按随机 / 骨架等方式划分；② 在 ADMET Benchmark Group 上按统一协议与已有模型对比结果。", "target": "leaf-tdc", "url": "https://tdcommons.ai/", "tags": ["ADMET 基准", "DTI", "数据划分"], "next": ["05-M1.4", "card-chemprop", "leaf-p-scaffold"], "madeBy": "让模型帮忙", "date": null}, {"id": "card-ich-gcp", "name": "ICH 指南体系（Q / S / E / M）", "def": "人用药品技术要求国际协调理事会（ICH）制定的技术指南，按质量（Q）、安全性（S）、有效性（E）、多学科（M）分类，被多国监管机构采纳。", "use": "① 查药品研发某一环节的国际共识要求，如 E6 药物临床试验质量管理规范（GCP）、Q8 药物开发；② 在 ich.org 下载指南原文，结合 NMPA 等本国法规理解 AI / 数据工作的合规背景。", "target": "04-M2.1", "url": "https://www.ich.org/", "tags": ["质量 Q", "安全 S", "有效性 E（含 GCP）", "多学科 M"], "next": ["04-M2.3", "03-M3.1", "leaf-nmpa"], "madeBy": "让模型帮忙", "date": null}, {"id": "card-rt1", "name": "RT-1", "def": "Google 的 Robotics Transformer：输入图像与语言指令，输出离散化的机器人动作 token，用大规模真实机器人示教数据训练。", "use": "① 理解「大规模真实数据 + Transformer 策略」范式及其泛化评测方法；② 与 RT-2 对比，看引入视觉语言模型带来的语义泛化差异。", "target": "10-M2.1", "url": "https://arxiv.org/abs/2212.06817", "tags": ["Robotics Transformer", "真实机器人大规模数据", "离散动作 token"], "next": ["card-rt2", "card-saycan", "09-M3.2"], "madeBy": "让模型帮忙", "date": "2022-12"}, {"id": "card-rt2", "name": "RT-2", "def": "Google 的视觉—语言—动作（VLA）模型：在网络图文数据与机器人轨迹上联合微调视觉语言模型，把动作表示为文本 token 输出。", "use": "① 理解 VLM → VLA 的核心思路与「动作即 token」的设计；② RT-2 未开源权重，想动手可用 OpenVLA 在开源数据上体验类似路线。", "target": "10-M2.1", "url": "https://arxiv.org/abs/2307.15818", "tags": ["VLA", "VLM 联合微调", "动作即文本 token", "语义泛化"], "next": ["card-rt1", "card-openvla", "10-M1.2", "leaf-openvla"], "madeBy": "让模型帮忙", "date": "2023-07"}, {"id": "card-oxe", "name": "Open X-Embodiment / RT-X", "def": "多家机构汇集的跨本体机器人示教数据集合，以统一的 RLDS 格式发布，并在其上训练了 RT-1-X / RT-2-X。", "use": "① 预训练或微调通用策略的数据来源；② 从中挑选与自己机器人形态、任务相近的子数据集；③ Octo、OpenVLA 都基于其中的数据训练，可直接对照学习。", "target": "09-M3.2", "url": "https://arxiv.org/abs/2310.08864", "tags": ["跨本体数据集", "多机构协作", "RT-1-X / RT-2-X"], "next": ["leaf-oxe", "card-octo", "10-M1.3"], "madeBy": "让模型帮忙", "date": "2023-10"}, {"id": "card-openvla", "name": "OpenVLA", "def": "开源的 7B 参数视觉—语言—动作模型，基于预训练视觉语言模型构建，在 Open X-Embodiment 数据上训练，输出离散化动作 token。", "use": "① 下载开源权重，用 LoRA 在自己的机器人数据上微调；② 作为 VLA 研究与对比实验的开源基线；③ 关注推理速度与量化部署问题（见 10-M3.2）。", "target": "10-M2.2", "url": "https://arxiv.org/abs/2406.09246", "tags": ["开源 VLA", "7B", "LoRA 微调", "Open X-Embodiment 训练"], "next": ["leaf-openvla", "card-rt2", "10-M3.2"], "madeBy": "让模型帮忙", "date": "2024-06"}, {"id": "card-octo", "name": "Octo", "def": "基于 Transformer、用扩散头输出动作的开源通用机器人策略，支持语言指令或目标图像作为任务条件。", "use": "① 用少量自有数据微调，适配新的机器人、相机或动作空间；② 作为通用策略的轻量开源基线，与 OpenVLA 对比。", "target": "10-M2.2", "url": "https://arxiv.org/abs/2405.12213", "tags": ["通用策略", "Transformer + 扩散动作头", "开源"], "next": ["leaf-octo", "card-openvla", "card-oxe"], "madeBy": "让模型帮忙", "date": "2024-05"}, {"id": "card-pi0", "name": "π0（pi-zero）", "def": "Physical Intelligence 的 VLA 模型：在预训练视觉语言模型上接一个用流匹配生成连续动作块的「动作专家」。", "use": "① 通过 openpi 获取代码与权重，在自己的数据上微调；② 学习「VLM 负责理解、动作专家负责高频连续控制」的分层设计，适合灵巧操作研究。", "target": "10-M2.3", "url": "https://arxiv.org/abs/2410.24164", "tags": ["VLM 主干", "流匹配动作专家", "高频连续控制", "跨本体"], "next": ["leaf-openpi", "card-diffusion-policy", "10-M3.1"], "madeBy": "让模型帮忙", "date": "2024-10"}, {"id": "card-diffusion-policy", "name": "Diffusion Policy", "def": "把视觉运动策略建模为条件去噪扩散过程：根据观测生成未来一段动作序列，擅长表达多峰的动作分布。", "use": "① 用官方代码或 LeRobot 内置实现在示教数据上训练；② 作为模仿学习的强基线，与 ACT 在同一任务上对比（见练习「用 LeRobot 训行为克隆策略」）。", "target": "09-M2.3", "url": "https://arxiv.org/abs/2303.04137", "tags": ["扩散模型", "视觉运动策略", "多峰动作分布"], "next": ["leaf-dp", "card-act", "card-pi0"], "madeBy": "让模型帮忙", "date": "2023-03"}, {"id": "card-act", "name": "ACT / ALOHA", "def": "ALOHA 是低成本双臂遥操作硬件系统；ACT（Action Chunking with Transformers）是配套的模仿学习算法，一次预测一段动作块。", "use": "① 用少量示教学习精细双臂操作；② LeRobot 内置 ACT 实现，可配合 SO-100 等低成本机械臂直接采集数据并训练。", "target": "09-M2.2", "url": "https://arxiv.org/abs/2304.13705", "tags": ["动作分块", "低成本双臂遥操作", "精细操作"], "next": ["leaf-aloha", "leaf-lerobot", "card-diffusion-policy"], "madeBy": "让模型帮忙", "date": "2023-04"}, {"id": "card-saycan", "name": "SayCan", "def": "Google 的「语言规划 + 技能」方法：用 LLM 判断某个技能对完成指令有多大帮助，再结合价值函数估计的可执行性，选出下一步技能。", "use": "① 作为「LLM 高层规划 + 底层技能库」系统设计的范式参考；② 养老场景中可把「取药盒」「递水杯」等封装成技能，由 LLM 负责排序与组合。", "target": "10-M2.4", "url": "https://arxiv.org/abs/2204.01691", "tags": ["LLM 高层规划", "可供性（affordance）", "技能库"], "next": ["card-palme", "08-M3.3", "10-M3.1"], "madeBy": "让模型帮忙", "date": "2022-04"}, {"id": "card-palme", "name": "PaLM-E", "def": "Google 的具身多模态语言模型：把图像、机器人状态等连续传感器输入编码后注入大语言模型，可输出任务规划等文本。", "use": "① 理解多模态输入如何接入 LLM；② 作为分层架构中高层规划器的设计参考（模型未开源，以读论文为主）。", "target": "10-M2.4", "url": "https://arxiv.org/abs/2303.03378", "tags": ["具身多模态语言模型", "传感器嵌入", "规划"], "next": ["card-saycan", "card-rt2", "10-M1.1"], "madeBy": "让模型帮忙", "date": "2023-03"}, {"id": "card-mujoco", "name": "MuJoCo", "def": "开源物理引擎，侧重接触丰富场景的快速、精确仿真，用 MJCF 描述模型，提供官方 Python 绑定。", "use": "① pip 安装 mujoco 后加载机器人模型，做控制与强化学习实验；② 搭配 Gymnasium、robosuite 使用现成任务环境（见练习「在 MuJoCo 环境里训 PPO」）。", "target": "11-M1.1", "url": "https://mujoco.org/", "tags": ["接触动力学", "MJCF", "Python 绑定", "开源"], "next": ["leaf-robosuite", "leaf-p-ppo", "11-M2.1"], "madeBy": "让模型帮忙", "date": null}, {"id": "card-lerobot", "name": "LeRobot", "def": "Hugging Face 的开源机器人学习库，提供统一的数据集格式、预训练策略以及真机采集、训练、部署工具。", "use": "① 下载 Hub 上的数据集，训练 ACT / Diffusion Policy 等策略；② 配合 SO-100 低成本机械臂采集示教数据并部署到真机。", "target": "leaf-lerobot", "url": "https://github.com/huggingface/lerobot", "tags": ["数据集格式", "ACT / Diffusion Policy 实现", "低成本硬件"], "next": ["leaf-so100", "card-act", "leaf-p-bc"], "madeBy": "让模型帮忙", "date": null}, {"id": " ": "向量、矩阵与线性变换是表示分子特征、图像和机器人位姿的共同语言；特征分解与奇异值分解（SVD）揭示矩阵的主要方向与秩。", "ask": ["矩阵乘法为什么可以理解为“线性变换的复合”？", "特征分解与 SVD 的适用条件有何不同？SVD 与 PCA 是什么关系？", "矩阵的秩、零空间在最小二乘问题里意味着什么？"], "read": [{"title": "MIT OCW 18.06 Linear Algebra（Gilbert Strang）", "url": "https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/"}, {"title": "3Blue1Brown：线性代数的本质（可视化系列）", "url": "https://www.3blue1brown.com/topics/linear-algebra"}]}, "00-M1.2": {"what": "用概率描述不确定性：随机变量与分布、条件概率、期望与方差；贝叶斯推断用“先验 × 似然”更新为后验，是不确定性估计与贝叶斯优化的基础。", "ask": ["条件概率与贝叶斯公式如何用于“检测阳性后真正患病的概率”这类问题？", "最大似然估计与贝叶斯后验估计的区别是什么？", "置信区间与贝叶斯可信区间的含义有何不同？"], "read": [{"title": "MIT OCW 18.05 Introduction to Probability and Statistics", "url": "https://ocw.mit.edu/courses/18-05-introduction-to-probability-and-statistics-spring-2014/"}, {"title": "Seeing Theory（布朗大学的可视化概率统计入门）", "url": "https://seeing-theory.brown.edu/"}]}, "00-M1.3": {"what": "梯度描述函数变化最快的方向，梯度下降是训练神经网络的核心；凸优化问题的局部最优即全局最优，是理解约束优化、MPC 与轨迹优化的基础。", "ask": ["什么是凸函数、凸集？为什么凸问题更容易求解？", "拉格朗日乘子法如何处理等式约束？", "学习率过大或过小分别会导致梯度下降出现什么现象？"], "read": [{"title": "Boyd & Vandenberghe, Convex Optimization（作者公开的教材与课件）", "url": "https://web.stanford.edu/~boyd/cvxbook/"}]}, "00-M1.4": {"what": "刚体在三维空间的姿态可用旋转矩阵、欧拉角、四元数等表示，位置 + 姿态合成齐次变换；旋转群（SO(3)）与刚体运动群（SE(3)）给出统一的数学框架。", "ask": ["欧拉角为什么会出现万向节锁？四元数如何避免？", "齐次变换矩阵如何把多个坐标系之间的变换串联起来？", "旋转矩阵需要满足哪些约束？"], "read": [{"title": "Lynch & Park, Modern Robotics（教材、视频与配套资源）", "url": "https://modernrobotics.northwestern.edu/"}]}, "00-M2.1": {"what": "NumPy 提供高效的多维数组与向量化运算，pandas 提供表格数据的读写、清洗与分组统计，Matplotlib 用于可视化——这是几乎所有科研数据处理的起点。", "ask": ["向量化运算为什么比 Python 循环快？广播（broadcasting）规则是什么？", "如何用 pandas 完成“按分组求均值、处理缺失值、合并两张表”？", "什么时候应该用数组，什么时候应该用 DataFrame？"], "read": [{"title": "NumPy: the absolute basics for beginners（官方入门）", "url": "https://numpy.org/doc/stable/user/absolute_beginners.html"}, {"title": "pandas Getting started（官方入门）", "url": "https://pandas.pydata.org/docs/getting_started/index.html"}]}, "00-M2.2": {"what": "命令行、Shell 脚本与 Git 版本控制是科研工程的基本功；虚拟 打分函数排序；虚拟筛选用对接或其他方法从大型化合物库中优先挑选值得实验测试的分子。", "ask": ["对接的“搜索算法”和“打分函数”分别负责什么？", "对接分数为什么不能直接当作结合亲和力？", "如何用已知活性 / 非活性分子评估虚拟筛选的富集能力？"], "read": [{"title": "Meng et al., Molecular Docking: A Powerful Approach for Structure-Based Drug Discovery（2011）", "url": "https://doi.org/10.2174/157340911795677602"}, {"title": "Trott & Olson, AutoDock Vina（J Comput Chem）", "url": "https://doi.org/10.1002/jcc.21334"}]}, "01-M4.5": {"what": "分子动力学（MD）用力场数值积分原子运动，模拟蛋白与配体随时间的构象变化，可用于研究柔性、结合稳定性以及自由能计算。", "ask": ["力场由哪些能量项组成？", "为什么需要能量最小化、升温与平衡等准备步骤？", "MD 模拟的时间尺度限制意味着哪些过程难以直接观察？"], "read": [{"title": "Hollingsworth & Dror, Molecular Dynamics Simulation for All（Neuron 2018）", "url": "https://doi.org/10.1016/j.neuron.2018.08.011"}]}, "02-M1.1": {"what": "药物多通过与受体等靶点结合发挥作用：激动剂激活受体，拮抗剂阻断激动剂作用，部分激动剂即使占满受体也只产生部分最大效应。", "ask": ["亲和力（affinity）与内在活性（efficacy）有何区别？", "竞争性与非竞争性拮抗剂对量效曲线的影响有何不同？", "反向激动剂与拮抗剂的区别是什么？"], "read": [{"title": "MSD Manual: Drug–Receptor Interactions", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/pharmacodynamics/drug-receptor-interactions"}]}, "02-M1.2": {"what": "量效关系描述剂量（或浓度）与效应的关系：EC50 反映效能（potency），Emax 反映最大效应（efficacy），治疗指数衡量有效剂量与毒性剂量之间的安全距离。", "ask": ["效能（potency）高是否意味着药物“更好”？", "治疗指数窄的药物在临床上需要注意什么？", "渐进型与全或无型量效曲线分别如何获得？"], "read": [{"title": "MSD Manual: Dose-Response Relationships", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/pharmacodynamics/dose-response-relationships"}]}, "02-M1.3": {"what": "主要药物类别按作用系统与机制划分（如心血管、中枢神经、抗感染、内分泌代谢等），常见靶点类别包括 G 蛋白偶联受体、离子通道、酶、核受体与转运体。", "ask": ["哪几类蛋白是现有药物最常见的靶点家族？", "举例说明同一靶点类别在不同疾病中的药物。", "了解药物类别对理解老年多重用药有何帮助？"], "read": [{"title": "Santos et al., A comprehensive map of molecular drug targets（Nat Rev Drug Discov）", "url": "https://doi.org/10.1038/nrd.2016.230"}, {"title": "MSD Manual: Overview of Pharmacodynamics", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/pharmacodynamics/overview-of-pharmacodynamics"}]}, "02-M1.4": {"what": "反复用药后机体反应减弱称为耐受；依赖涉及停药后的生理或心理症状；遗传、年龄、疾病与合并用药都会造成药物反应的个体差异。", "ask": ["耐受与耐药（resistance）有何不同？", "哪些药物类别在老年人中容易出现依赖或戒断问题？", "个体差异的主要来源有哪些？"], "read": [{"title": "MSD Manual: Tolerance and Resistance", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/factors-affecting-response-to-medications/tolerance-and-resistance"}]}, "02-M2.1": {"what": "ADME 描述药物在体内的过程：吸收进入血液、分布到组织、经代谢转化、最终排泄出体外；四个环节共同决定药物浓度随时间的变化。", "ask": ["影响口服吸收的主要因素有哪些？", "血浆蛋白结合如何影响药物分布和作用？", "肝代谢与肾排泄分别对哪类药物更重要？"], "read": [{"title": "MSD Manual: Overview of Pharmacokinetics", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/pharmacokinetics/overview-of-pharmacokinetics"}, {"title": "MSD Manual: Drug Metabolism", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/pharmacokinetics/drug-metabolism"}]}, "02-M2.2": {"what": "细胞色素 P450（CYP）酶家族负责大量药物的氧化代谢，转运体（如 P-gp、OATP）影响药物进出细胞；它们的抑制、诱导与遗传多态性是药物相互作用和个体差异的主要来源。", "ask": ["哪些 CYP 亚型参与了最多的药物代谢？", "酶抑制和酶诱导对合用药物的血药浓度分别有什么影响？", "转运体介导的相互作用与 CYP 介导的有何不同？"], "read": [{"title": "Zanger & Schwab, Cytochrome P450 enzymes in drug metabolism（Pharmacol Ther 2013）", "url": "https://doi.org/10.1016/j.pharmthera.2012.12.007"}, {"title": "FDA: Examples of Drugs that Interact with CYP Enzymes and Transporter Systems", "url": "https://www.fda.gov/drugs/drug-interactions-labeling/healthcare-professionals-fdas-examples-drugs-interact-cyp-enzymes-and-transporter-systems"}]}, "02-M2.3": {"what": "核心药代参数：半衰期（浓度减半所需时间）、清除率（单位时间清除药物的血浆体积）、分布容积（药量与血药浓度的比例）、生物利用度（进入体循环的比例）与 AUC（暴露量）。", "ask": ["清除率、分布容积与半衰期三者是什么关系？", "为什么多次给药通常需要若干个半衰期才达到稳态？", "口服生物利用度受哪些过程影响？"], "read": [{"title": "MSD Manual: Overview of Pharmacokinetics", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/pharmacokinetics/overview-of-pharmacokinetics"}, {"title": "MSD Manual: Drug Bioavailability", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/pharmacokinetics/drug-bioavailability"}]}, "02-M2.4": {"what": "房室模型把身体简化为若干药物均匀分布的“隔室”，用微分方程描述浓度变化；非房室分析不假设模型结构，直接从浓度—时间数据计算 AUC、半衰期等参数。", "ask": ["一室模型与二室模型的浓度—时间曲线有何区别？", "非房室分析中 AUC 通常如何计算？", "什么时候应选用房室模型而不是非房室分析？"], "read": [{"title": "Mould & Upton, Basic Concepts in Population Modeling, Simulation, and Model-Based Drug Development（CPT PSP 2012）", "url": "https://doi.org/10.1038/psp.2012.4"}]}, "02-M2.5": {"what": "群体药代（PopPK）用混合效应模型描述人群典型参数与个体间变异，并寻找年龄、体重、肾功能等协变量；生理药代（PBPK）用器官血流与组织参数机制性地预测药代，常用于特殊人群外推与相互作用评估。", "ask": ["PopPK 中固定效应与随机效应分别代表什么？", "PBPK 模型为什么适合预测老年人或肝肾功能不全者的暴露？", "PopPK 与 PBPK 的数据需求有何不同？"], "read": [{"title": "Mould & Upton, Basic Concepts in Population Modeling, Simulation, and Model-Based Drug Development（CPT PSP 2012）", "url": "https://doi.org/10.1038/psp.2012.4"}, {"title": "Jones & Rowland-Yeo, Basic Concepts in Physiologically Based Pharmacokinetic Modeling（CPT PSP 2013）", "url": "https://doi.org/10.1038/psp.2013.41"}]}, "02-M3.1": {"what": "药物相互作用指一种药物改变另一种药物的效应或浓度，可发生在药代层面（如酶抑制 / 诱导、转运体）或药效层面（如作用叠加或拮抗）。", "ask": ["药代学相互作用与药效学相互作用各举一例。", "为什么老年多重用药人群的相互作用风险更高？", "评估一个相互作用的临床意义时要考虑哪些因素？"], "read": [{"title": "MSD Manual: Drug Interactions", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/factors-affecting-response-to-medications/drug-interactions"}, {"title": "FDA: Examples of Drugs that Interact with CYP Enzymes and Transporter Systems", "url": "https://www.fda.gov/drugs/drug-interactions-labeling/healthcare-professionals-fdas-examples-drugs-interact-cyp-enzymes-and-transporter-systems"}]}, "02-M3.2": {"what": "非临床毒理学研究包括单次与重复给药毒性、遗传毒性、生殖毒性、致癌性与安全药理等，用于在进入人体前识别风险并确定安全起始剂量，相关要求见 ICH 安全性（S）指南。", "ask": ["遗传毒性试验组合通常包括哪些类型的试验？", "动物毒理结果外推到人时有哪些局限？", "计算毒理预测在哪些环节可以辅助实验？"], "read": [{"title": "ICH Safety Guidelines（以官网最新版本为准）", "url": "https://www.ich.org/page/safety-guidelines"}]}, "02-M3.3": {"what": "hERG 钾通道被阻断可延长心电图 QT 间期、增加尖端扭转型室速风险，是药物心脏安全评估的重点；药物性肝损伤是另一类常见的上市后撤市与研发失败原因。", "ask": ["为什么很多结构多样的药物都能阻断 hERG？", "QT 延长风险评估在非临床与临床阶段分别怎么做？", "药物性肝损伤为什么难以在临床前充分预测？"], "read": [{"title": "Sanguinetti & Tristani-Firouzi, hERG potassium channels and cardiac arrhythmia（Nature 2006）", "url": "https://doi.org/10.1038/nature04710"}, {"title": "ICH Safety Guidelines（含心脏安全相关指南，以官网最新版本为准）", "url": "https://www.ich.org/page/safety-guidelines"}]}, "02-M3.4": {"what": "药物不良反应常按机制分为与剂量相关、可由药理作用预期的反应，和与剂量关系不明显、难以预测的反应（如部分过敏和特异质反应）。", "ask": ["不良反应（ADR）与不良事件（AE）的区别是什么？", "判断一个事件是否由药物引起时常考虑哪些因素？", "老年人中哪些不良反应特别值得警惕？"], "read": [{"title": "Edwards & Aronson, Adverse drug reactions: definitions, diagnosis, and management（Lancet 2000）", "url": "https://doi.org/10.1016/S0140-6736(00)02799-9"}, {"title": "MSD Manual: Adverse Drug Reactions", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/concepts-in-pharmacotherapy/adverse-drug-reactions"}]}, "02-M4.1": {"what": "药物基因组学研究基因变异如何影响药物反应，例如代谢酶基因多态性会改变部分药物的暴露或疗效，相关临床指南可用于指导选药与剂量调整。", "ask": ["慢代谢型与超快代谢型分别可能带来什么风险？", "药物基因组学检测在临床落地中面临哪些障碍？", "如何查找某个基因—药物组合是否有临床实施指南？"], "read": [{"title": "MSD Manual: Pharmacogenetics", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/factors-affecting-response-to-medications/pharmacogenetics"}, {"title": "CPIC 药物基因组学临床实施指南入口", "url": "https://cpicpgx.org/"}]}, "02-M4.2": {"what": "治疗药物监测（TDM）测定血药浓度来个体化调整剂量，适用于治疗窗窄、个体差异大、浓度与疗效 / 毒性关系明确的药物。", "ask": ["哪些特征的药物适合做 TDM？", "谷浓度与峰浓度分别提供什么信息？", "模型引导的精准给药与传统 TDM 有何关系？"], "read": [{"title": "Kang & Lee, Overview of Therapeutic Drug Monitoring（Korean J Intern Med 2009）", "url": "https://doi.org/10.3904/kjim.2009.24.1.1"}, {"title": "MSD Manual: Emerging Paradigms in Precision Dosing", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/pharmacokinetics/emerging-paradigms-in-precision-dosing"}]}, "02-M4.3": {"what": "老年人、肝肾功能不全者、儿童与孕妇的药代和药效与一般成人不同，往往需要调整剂量或换药；老年人常见肾清除下降、体成分改变和对某些药物更敏感。", "ask": ["肾功能下降时，哪类药物最需要调整剂量？", "老年人体脂比例增加对脂溶性药物的分布有什么影响？", "为什么特殊人群的用药证据往往不足？"], "read": [{"title": "MSD Manual: Pharmacokinetics in Older Adults", "url": "https://www.msdmanuals.com/professional/geriatrics/pharmacologic-therapy-in-older-adults/pharmacokinetics-in-older-adults"}, {"title": "MSD Manual: Pharmacodynamics in Older Adults", "url": "https://www.msdmanuals.com/professional/geriatrics/pharmacologic-therapy-in-older-adults/pharmacodynamics-in-older-adults"}]}, "03-M1.1": {"what": "剂型是药物交给患者的具体形式，如片剂、胶囊、注射剂、吸入剂、透皮贴剂；剂型影响起效速度、作用时长、依从性与稳定性。", "ask": ["同一药物为什么会开发多种剂型？", "透皮贴剂和吸入剂各适合什么类型的药物？", "剂型选择如何影响老年患者的使用体验？"], "read": [{"title": "MSD Manual: Drug Absorption（含给药途径与剂型对吸收的影响）", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/pharmacokinetics/drug-absorption"}]}, "03-M1.2": {"what": "给药途径决定药物如何进入体循环；口服药物吸收后先经肝脏，部分在到达体循环前被代谢，称为首过效应，静脉、舌下、透皮等途径可绕过或减少首过效应。", "ask": ["为什么静脉给药的生物利用度被视为 100% 的参照？", "首过效应大的药物适合哪些替代给药途径？", "不同途径的起效速度大致如何排序？"], "read": [{"title": "MSD Manual: Drug Absorption", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/pharmacokinetics/drug-absorption"}, {"title": "MSD Manual: Drug Bioavailability", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/pharmacokinetics/drug-bioavailability"}]}, "03-M1.3": {"what": "口服固体制剂需要先溶出才能吸收；生物药剂学分类系统（BCS）按溶解度和肠道渗透性把药物分为四类，用于指导制剂开发与部分生物等效性豁免。", "ask": ["BCS 四类各自的溶解度与渗透性组合是什么？", "低溶解度药物有哪些常见的增溶制剂手段？", "体外溶出试验为什么能在一定条件下替代体内研究？"], "read": [{"title": "Amidon et al., A Theoretical Basis for a Biopharmaceutic Drug Classification（Pharm Res 1995）", "url": "https://doi.org/10.1023/A:1016212804288"}]}, "03-M2.1": {"what": "缓释 / 控释制剂通过骨架扩散、膜控、渗透泵等机制延长或控制药物释放，减少给药次数、平稳血药浓度，但不能随意掰开或碾碎。", "ask": ["缓释与控释在释放特性上有什么区别？", "为什么碾碎缓释片可能造成危险？", "扩散控制型释放可以如何用数学模型描述？"], "read": [{"title": "Siepmann & Siepmann, Modeling of diffusion controlled drug delivery（J Control Release 2012）", "url": "https://doi.org/10.1016/j.jconrel.2011.10.006"}]}, "03-M2.2": {"what": "纳米递送系统（如脂质体、聚合物纳米粒、脂质纳米粒 LNP）可保护药物、改善分布或实现胞内递送；LNP 是 mRNA 等核酸药物的关键递送载体。", "ask": ["LNP 通常由哪几类脂质组成，各起什么作用？", "纳米制剂的体内分布为什么常富集在肝脏？", "纳米药物在质量控制上有哪些额外挑战？"], "read": [{"title": "Hou et al., Lipid nanoparticles for mRNA delivery（Nat Rev Mater 2021）", "url": "https://doi.org/10.1038/s41578-021-00358-0"}, {"title": "MSD Manual: Nanomedicine", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/pharmacokinetics/nanomedicine"}]}, "03-M2.3": {"what": "靶向递送让药物更多地到达病灶；抗体偶联药物（ADC）由抗体、连接子与细胞毒载荷组成，借抗体识别靶细胞后释放载荷。", "ask": ["ADC 的三个组成部分各自影响哪些性质？", "可裂解与不可裂解连接子有何区别？", "“旁观者效应”指什么？"], "read": [{"title": "Drago, Modi & Chandarlapaty, Unlocking the potential of antibody–drug conjugates for cancer therapy（Nat Rev Clin Oncol 2021）", "url": "https://doi.org/10.1038/s41571-021-00470-8"}]}, "03-M3.1": {"what": "质量源于设计（QbD）强调先定义目标产品质量特征，再通过风险评估和实验设计理解关键物料属性与工艺参数，把质量“设计进”产品而非仅靠终检，相关要求见 ICH Q8–Q12 等指南。", "ask": ["目标产品质量概况（QTPP）与关键质量属性（CQA）是什么关系？", "设计空间（design space）指什么？", "机器学习可以在 QbD 的哪些环节提供帮助？"], "read": [{"title": "Yu et al., Understanding Pharmaceutical Quality by Design（AAPS J 2014）", "url": "https://doi.org/10.1208/s12248-014-9598-3"}, {"title": "ICH Quality Guidelines（以官网最新版本为准）", "url": "https://www.ich.org/page/quality-guidelines"}]}, "03-M3.2": {"what": "药品生产质量管理规范（GMP）规定了生产与质量控制的最低要求；连续制造把传统分批生产改为连续流程，配合过程分析技术实现实时质量控制。", "ask": ["GMP 关注哪些方面（人员、厂房、设备、文件、偏差处理等）？", "连续制造相比批生产的优势与监管挑战是什么？", "数据完整性在 GMP 中为什么重要？"], "read": [{"title": "FDA: Current Good Manufacturing Practice (CGMP) Regulations", "url": "https://www.fda.gov/drugs/pharmaceutical-quality-resources/current-good-manufacturing-practice-cgmp-regulations"}, {"title": "ICH Quality Guidelines（含连续制造相关指南，以官网最新版本为准）", "url": "https://www.ich.org/page/quality-guidelines"}]}, "03-M3.3": {"what": "稳定性研究考察药品在温度、湿度、光照等条件下质量随时间的变化，用于确定有效期与贮存条件；包装材料对防潮、避光与儿童安全也很关键。", "ask": ["长期试验与加速试验分别用来做什么？", "为什么有些药品要求避光或冷藏保存？", "分装到药盒后，药品稳定性可能受到什么影响？"], "read": [{"title": "ICH Quality Guidelines（稳定性相关指南，以官网最新版本为准）", "url": "https://www.ich.org/page/quality-guidelines"}]}, "03-M3.4": {"what": "仿制药需证明与参比制剂药学等效且生物等效（体内暴露相当）；中国开展的仿制药质量和疗效一致性评价也以此为核心思路，具体要求以国家药监局官方文件为准。", "ask": ["生物等效性研究通常比较哪些药代参数？", "什么情况下可以申请生物等效性豁免？", "一致性评价对药品市场和患者有什么影响？"], "read": [{"title": "FDA: Abbreviated New Drug Application (ANDA)", "url": "https://www.fda.gov/drugs/types-applications/abbreviated-new-drug-application-anda"}]}, "03-M4.1": {"what": "吞咽困难在老年人中常见；剂型选择要考虑口崩片、液体制剂、颗粒剂等替代方案，并确认药品能否掰开或碾碎，缓释、肠溶等剂型通常不可碾碎。", "ask": ["哪些剂型一般不能碾碎？为什么？", "碾碎药物混入食物或经鼻饲给药时有哪些风险？", "照护场景中如何快速查询某药能否碾碎？"], "read": [{"title": "ISMP: Do Not Crush 清单与相关推荐", "url": "https://www.ismp.org/recommendations/do-not-crush"}, {"title": "MSD Manual: Dysphagia", "url": "https://www.msdmanuals.com/professional/gastrointestinal-disorders/esophageal-and-swallowing-disorders/dysphagia"}]}, "03-M4.2": {"what": "适老化包装与标签包括大字号与高对比度标签、易开启（同时兼顾儿童安全）的容器、按时间分格的单剂量包装等，目标是减少看错、拿错和漏服。", "ask": ["老年人在识别和开启药品包装时常遇到哪些困难？", "单剂量 / 泡罩分装如何帮助提高依从性？", "易开启与儿童安全包装之间如何权衡？"], "read": [{"title": "MSD Manual: Adherence to a Medication Regimen", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/factors-affecting-response-to-medications/adherence-to-a-medication-regimen"}, {"title": "MSD Manual: Pharmacists and Older Adults", "url": "https://www.msdmanuals.com/professional/geriatrics/providing-care-to-older-adults/pharmacists-and-older-adults"}]}, "03-M4.3": {"what": "固定剂量复方把两种或以上活性成分做成一个制剂，可减少服药片数、简化方案、改善依从性，但会降低单独调整某一成分剂量的灵活性。", "ask": ["固定剂量复方在哪些慢病中应用较多？", "复方制剂的主要缺点是什么？", "方案简化为什么是提升老年人依从性的重要手段？"], "read": [{"title": "Bangalore et al., Fixed-Dose Combinations Improve Medication Compliance: A Meta-Analysis（Am J Med 2007）", "url": "https://doi.org/10.1016/j.amjmed.2006.08.033"}]}, "04-M1.1": {"what": "临床试验通常分为 I 期（安全性与药代，常在少量受试者中进行）、II 期（初步疗效与剂量探索）、III 期（大样本确证疗效与安全性）和 IV 期（上市后研究）。", "ask": ["各期试验的主要目的分别是什么？", "为什么 III 期试验常需要多中心、较大样本？", "上市后研究能发现哪些上市前难以发现的问题？"], "read": [{"title": "FDA: Step 3 Clinical Research", "url": "https://www.fda.gov/patients/drug-development-process/step-3-clinical-research"}, {"title": "ClinicalTrials.gov（临床试验注册库）", "url": "https://clinicaltrials.gov/"}]}, "04-M1.2": {"what": "随机化平衡已知和未知的混杂因素，对照组提供比较基准，盲法减少评估偏倚；所有涉及人的研究都需伦理审查与受试者知情同意。", "ask": ["随机化与盲法分别主要控制哪类偏倚？", "安慰剂对照在什么情况下不符合伦理？", "认知障碍老人参加试验时，知情同意如何处理？"], "read": [{"title": "WMA Declaration of Helsinki（赫尔辛基宣言）", "url": "https://www.wma.net/policies-post/wma-declaration-of-helsinki/"}, {"title": "ICH Efficacy Guidelines（含 E6 GCP，以官网最新版本为准）", "url": "https://www.ich.org/page/efficacy-guidelines"}]}, "04-M1.3": {"what": "终点是衡量疗效的指标（临床终点、替代终点、患者报告结局等）；统计分析需预先规定，意向治疗（ITT）分析按随机分组分析以保留随机化带来的可比性，样本量由预期效应与把握度决定。", "ask": ["替代终点有什么优点和风险？", "ITT 分析与符合方案集（PP）分析有何区别？", "样本量计算需要哪些输入？"], "read": [{"title": "ICH Efficacy Guidelines（含 E9 统计原则，以官网最新版本为准）", "url": "https://www.ich.org/page/efficacy-guidelines"}, {"title": "CONSORT / SPIRIT（临床试验报告与方案规范）", "url": "https://www.consort-spirit.org/"}]}, "04-M1.4": {"what": "老年人（尤其是高龄、多病共存、多重用药者）在临床试验中常被排除或比例偏低，导致上市证据难以直接外推到真实老年患者；ICH E7 专门讨论老年人群研究。", "ask": ["试验中常见的哪些排除标准会把老年人挡在门外？", "证据不足会对老年人的用药决策造成什么影响？", "真实世界数据能在多大程度上弥补这一缺口？"], "read": [{"title": "ICH Efficacy Guidelines（含 E7 老年人群研究，以官网最新版本为准）", "url": "https://www.ich.org/page/efficacy-guidelines"}, {"title": "MSD Manual: Overview of Pharmacologic Therapy in Older Adults", "url": "https://www.msdmanuals.com/professional/geriatrics/pharmacologic-therapy-in-older-adults/overview-of-pharmacologic-therapy-in-older-adults"}]}, "04-M1.5": {"what": "真实世界数据（RWD）来自电子病历、医保理赔、登记库、可穿戴设备等日常医疗数据；经过严谨分析得到的真实世界证据（RWE）可支持监管与临床决策。", "ask": ["RWD 相比随机对照试验数据有哪些偏倚风险？", "目标试验模拟（target trial emulation）想解决什么问题？", "居家监测数据成为 RWD 需要满足哪些质量要求？"], "read": [{"title": "FDA: Real-World Evidence", "url": "https://www.fda.gov/science-research/science-and-research-special-topics/real-world-evidence"}]}, "04-M2.1": {"what": "主要药品监管机构包括中国国家药品监督管理局（NMPA）、美国 FDA、欧洲药品管理局（EMA）等；ICH 协调各国技术要求，使研发资料可在多地区通用。", "ask": ["NMPA、FDA、EMA 的审评体系各有什么特点？", "加入 ICH 对中国药品研发有什么意义？", "查询某国最新监管要求应以什么来源为准？"], "read": [{"title": "ICH 官方网站", "url": "https://www.ich.org/"}, {"title": "European Medicines Agency（EMA）", "url": "https://www.ema.europa.eu/en"}]}, "04-M2.2": {"what": "新药在进入人体试验前需提交临床试验申请（美国称 IND），完成研究后提交上市申请（化学药为 NDA，生物制品为 BLA）；中国有对应的临床试验申请与上市许可申请制度。", "ask": ["IND 申请通常需要包含哪些资料？", "NDA 与 BLA 的适用对象有何不同？", "加速审批、优先审评等特殊通道的目的是什么？"], "read": [{"title": "FDA: Investigational New Drug (IND) Application", "url": "https://www.fda.gov/drugs/types-applications/investigational-new-drug-ind-application"}, {"title": "FDA: New Drug Application (NDA)", "url": "https://www.fda.gov/drugs/types-applications/new-drug-application-nda"}]}, "04-M2.3": {"what": "GCP 规范临床试验的设计、实施、记录与报告，GLP 规范非临床安全性研究；数据完整性要求数据可归因、清晰、同步、原始、准确（常称 ALCOA 原则）。", "ask": ["GCP 中申办者、研究者与伦理委员会各承担什么职责？", "ALCOA 各字母代表什么？", "在 AI 研究中使用临床数据时，数据完整性要求意味着什么？"], "read": [{"title": "ICH Efficacy Guidelines（含 E6 GCP，以官网最新版本为准）", "url": "https://www.ich.org/page/efficacy-guidelines"}, {"title": "FDA 指导原则检索（以官网最新文件为准）", "url": "https://www.fda.gov/regulatory-information/search-fda-guidance-documents"}]}, "04-M2.4": {"what": "独立承担医疗用途的软件可能被作为医疗器械（SaMD）监管；监管通常按风险分级，并关注临床验证、算法变更管理和上市后性能监测，AI 软件的具体要求以各国最新官方文件为准。", "ask": ["什么样的健康类软件会被认定为医疗器械？", "基于机器学习的软件更新为什么给监管带来新问题？", "一个用药提醒 App 和一个给出剂量建议的 App 在监管上可能有何不同？"], "read": [{"title": "FDA: Software as a Medical Device (SaMD)", "url": "https://www.fda.gov/medical-devices/digital-health-center-excellence/software-medical-device-samd"}]}, "04-M3.1": {"what": "药物警戒是发现、评估、理解和预防药物不良反应及其他药物相关问题的科学与活动，贯穿药品全生命周期，上市后的自发报告是重要信息来源。", "ask": ["上市前临床试验为什么无法发现所有不良反应？", "一个国家的药物警戒体系通常包括哪些组成部分？", "WHO 国际药物监测合作中心（Uppsala Monitoring Centre）承担什么角色？"], "read": [{"title": "WHO: Pharmacovigilance", "url": "https://www.who.int/teams/regulation-prequalification/regulation-and-safety/pharmacovigilance"}, {"title": "Uppsala Monitoring Centre", "url": "https://who-umc.org/"}]}, "04-M3.2": {"what": "自发报告数据库收集医务人员与公众上报的不良事件；比例失衡分析（如报告比值比 ROR、比例报告比 PRR、贝叶斯方法）用于从中发现可能的药物—事件信号。", "ask": ["比例失衡分析的基本思想是什么？", "自发报告存在哪些偏倚（如漏报、刺激报告）？", "信号被检测出来后，还需要哪些步骤才能确认因果？"], "read": [{"title": "Bate & Evans, Quantitative signal detection using spontaneous ADR reporting（Pharmacoepidemiol Drug Saf 2009）", "url": "https://doi.org/10.1002/pds.1742"}, {"title": "FDA 不良事件监测系统说明页", "url": "https://www.fda.gov/drugs/surveillance/questions-and-answers-fdas-adverse-event-reporting-system-faers"}]}, "04-M3.3": {"what": "用药错误可发生在处方、转抄、调配、给药与监测等任一环节，常按错误类型与造成伤害的程度分类；防范依靠系统设计而不是只责备个人。", "ask": ["用药错误、不良反应、不良事件三者是什么关系？", "养老机构中给药环节常见的错误类型有哪些？", "条码扫描、电子处方等技术如何减少用药错误？"], "read": [{"title": "NCC MERP: Taxonomy of Medication Errors", "url": "https://www.nccmerp.org/taxonomy-medication-errors"}, {"title": "MSD Manual: Medication Errors", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/concepts-in-pharmacotherapy/medication-errors"}]}, "04-M4.1": {"what": "处方审核由药师检查处方的适应证、剂量、相互作用、禁忌与重复用药等问题；合理用药强调在正确的适应证下以合适的剂量、疗程和成本用药。", "ask": ["处方审核通常检查哪些方面？", "老年人中常见的药物相关问题有哪些？", "规则引擎辅助审方的优点与局限是什么？"], "read": [{"title": "MSD Manual: Medication-Related Problems in Older Adults", "url": "https://www.msdmanuals.com/professional/geriatrics/pharmacologic-therapy-in-older-adults/medication-related-problems-in-older-adults"}, {"title": "MSD Manual: Medication Errors", "url": "https://www.msdmanuals.com/professional/clinical-pharmacology/concepts-in-pharmacotherapy/medication-errors"}]}, "04-M4.2": {"what": "药物重整是在入院、转科、出院等照护交接时，比较患者实际在用药物与新医嘱，发现并解决遗漏、重复、剂量错误等差异的过程。", "ask": ["药物重整通常包括哪几个步骤？", "为什么照护交接是用药错误的高发环节？", "获取“最佳可得用药史”需要哪些信息来源？"], "read": [{"title": "AHRQ PSNet: Medication Reconciliation", "url": "https://psnet.ahrq.gov/primer/medication-reconciliation"}, {"title": "Mueller et al., Hospital-Based Medication Reconciliation Practices: A Systematic Review（Arch Intern Med 2012）", "url": "https://doi.org/10.1001/archinternmed.2012.2246"}]}, "04-M4.3": {"what": "临床药师参与用药评估、方案优化、患者教育与随访，在慢病管理与老年多重用药管理中发挥作用，常与医生、护士组成多学科团队。", "ask": ["药师主导的用药评估通常包括哪些内容？", "药学门诊与传统药房调剂服务有什么不同？", "数字化工具如何帮助药师开展远程随访？"], "read": [{"title": "MSD Manual: Pharmacists and Older Adults", "url": "https://www.msdmanuals.com/professional/geriatrics/providing-care-to-older-adults/pharmacists-and-older-adults"}]}, "05-M1.1": {"what": "把分子变成模型能吃的向量或图：手工指纹（如 ECFP）、图神经网络在原子—键图上做消息传递、或把 SMILES 当作序列交给语言模型。", "ask": ["分子指纹、分子图、SMILES 三种表示各自丢失或保留了哪些信息？", "消息传递神经网络（MPNN）一轮“消息—更新—读出”分别在做什么？", "同一个分子有多个合法 SMILES，这对序列模型意味着什么？"], "read": [{"title": "Gilmer et al., Neural Message Passing for Quantum Chemistry（MPNN 统一框架）", "url": "https://arxiv.org/abs/1704.01212"}, {"title": "RDKit 入门文档（分子读写与指纹）", "url": "https://www.rdkit.org/docs/GettingStartedInPython.html"}]}, "05-M1.2": {"what": "把氨基酸序列（或结构）编码成向量；蛋白语言模型（如 ESM）在海量序列上自监督预训练，其表示可迁移到功能、结构等下游任务。", "ask": ["蛋白语言模型的掩码预训练和 NLP 里的 BERT 有何异同？", "为什么只靠单条序列的嵌入也能包含结构信息？", "序列表示与结构表示各适合什么下游任务？"], "read": [{"title": "Rives et al., PNAS 2021（ESM：无监督学习 2.5 亿条蛋白序列）", "url": "https://doi.org/10.1073/pnas.2016239118"}, {"title": "Lin et al., Science 2023（ESM-2 / ESMFold）", "url": "https://doi.org/10.1126/science.ade2574"}]}, "05-M1.3": {"what": "AIDD 的数据底座：ChEMBL（类药分子活性）、PubChem（化合物与筛选数据）、PDB（实验结构）、ZINC（可购买化合物）、DrugBank（药物与靶点知识）各有分工与许可条款。", "ask": ["想做某靶点的活性预测，应该去哪个库取数据？要注意哪些活性类型与单位？", "实验结构（PDB）和预测结构（AlphaFold DB）在使用上有什么区别？", "哪些数据库对商业使用有许可限制？"], "read": [{"title": "ChEMBL 官方站点", "url": "https://www.ebi.ac.uk/chembl/"}, {"title": "PDB-101（RCSB 的结构生物学入门教育资源）", "url": "https://pdb101.rcsb.org/"}]}, "05-M1.4": {"what": "分子数据里相似结构会扎堆，随机划分会让测试集与训练集过于相似而高估性能；骨架划分、时间划分等更接近真实的外推场景。", "ask": ["什么是 Bemis–Murcko 骨架？骨架划分如何构造？", "为什么同一模型在随机划分和骨架划分上性能会差很多？", "除了划分方式，还有哪些常见的数据泄漏来源（如重复分子、同一实验批次）？"], "read": [{"title": "Wu et al., MoleculeNet: A Benchmark for Molecular Machine Learning", "url": "https://arxiv.org/abs/1703.00564"}, {"title": "DeepChem Splitters 文档（随机 / 骨架 / 聚类等划分实现）", "url": "https://deepchem.readthedocs.io/en/latest/api_reference/splitters.html"}]}, "05-M2.1": {"what": "定量构效关系（QSAR）：用分子描述符或学到的表示，回归或分类预测活性与性质；经典流程强调数据整理、验证和适用域。", "ask": ["一个规范的 QSAR 建模流程包括哪些步骤？", "描述符 + 随机森林 与 图神经网络 各自的优劣是什么？", "活性悬崖（activity cliff）为什么会让 QSAR 模型失效？"], "read": [{"title": "Cherkasov et al., QSAR Modeling: Where Have You Been? Where Are You Going To?（J Med Chem 2014 综述）", "url": "https://doi.org/10.1021/jm4004285"}, {"title": "Chemprop 文档（消息传递网络性质预测工具）", "url": "https://chemprop.readthedocs.io/"}]}, "05-M2.2": {"what": "用模型预测吸收、分布、代谢、排泄与毒性（ADMET）终点，在合成前淘汰成药性差的分子；多为数据量有限、噪声较大的任务。", "ask": ["常见 ADMET 终点（溶解度、渗透性、CYP 抑制、hERG 等）分别对应药代 / 毒理中的什么问题？", "为什么 ADMET 数据往往比活性数据更难建模？", "体外 ADMET 预测与体内药代表现之间有什么差距？"], "read": [{"title": "TDC ADMET Benchmark Group", "url": "https://tdcommons.ai/benchmark/admet_group/overview/"}, {"title": "Daina et al., SwissADME（Sci Rep 2017）", "url": "https://doi.org/10.1038/srep42717"}]}, "05-M2.3": {"what": "预测药物（小分子）与靶点（蛋白）是否结合及结合强弱；输入通常是分子表示 + 蛋白序列 / 结构表示，难点在新靶点、新骨架上的泛化。", "ask": ["DTI 的分类任务与亲和力回归任务（如 Kd / Ki）有何区别？", "“冷启动”划分（新药物 / 新靶点）为什么比随机划分难得多？", "只用序列的 DTI 模型与基于结构的方法相比有哪些局限？"], "read": [{"title": "Öztürk et al., DeepDTA: Deep Drug-Target Binding Affinity Prediction", "url": "https://arxiv.org/abs/1801.10193"}, {"title": "TDC DTI 任务说明", "url": "https://tdcommons.ai/multi_pred_tasks/dti/"}]}, "05-M2.4": {"what": "模型应告诉你“它有多确定”和“这个分子是否在它见过的化学空间内”；常用集成、MC Dropout、证据学习等估计不确定性，用相似度等界定适用域。", "ask": ["偶然不确定性与认知不确定性有什么区别？", "如何评价一个不确定性估计是否“校准”良好？", "在先导优化中，不确定性可以怎样指导下一轮实验选择？"], "read": [{"title": "Hirschfeld et al., Uncertainty Quantification Using Neural Networks for Molecular Property Prediction", "url": "https://arxiv.org/abs/2005.10036"}, {"title": "Chemprop 文档（含不确定性估计用法）", "url": "https://chemprop.readthedocs.io/"}]}, "05-M3.1": {"what": "从氨基酸序列预测三维结构；AlphaFold 2 结合多序列比对与注意力网络大幅提升精度，并附带每残基置信度（pLDDT）。", "ask": ["多序列比对（MSA）为什么能提供结构信息？", "pLDDT 与 PAE 分别表示什么？低置信区域该如何解读？", "预测结构直接用于药物设计时要注意什么（如构象、口袋柔性）？"], "read": [{"title": "Jumper et al., AlphaFold 2（Nature 2021）", "url": "https://www.nature.com/articles/s41586-021-03819-2"}, {"title": "Mirdita et al., ColabFold: making protein folding accessible to all（Nat Methods 2022）", "url": "https://doi.org/10.1038/s41592-022-01488-1"}]}, "05-M3.2": {"what": "把结构预测从单链扩展到蛋白—蛋白、蛋白—配体、蛋白—核酸等复合物；AlphaFold 3 等模型引入扩散式结构生成来处理多类分子。", "ask": ["复合物结构预测相比单链结构预测多了哪些难点？", "预测出的蛋白—配体复合物能否直接代替对接或实验结构？证据是什么？", "这类模型的使用条款（代码、权重、服务器）对科研有何影响？"], "read": [{"title": "Abramson et al., AlphaFold 3（Nature 2024）", "url": "https://www.nature.com/articles/s41586-024-07487-w"}, {"title": "AlphaFold Server（官方在线服务）", "url": "https://alphafoldserver.com/"}]}, "05-M3.3": {"what": "用深度学习直接生成配体在口袋中的结合姿态（如把对接视为生成问题的 DiffDock），并需用物理合理性检查和新靶点测试来评估其真实可用性。", "ask": ["传统对接的“搜索 + 打分”与生成式对接的思路有何不同？", "只看 RMSD < 2 Å 的成功率为什么不够？还应检查什么？", "在训练集中未见过的蛋白上，深度学习对接表现如何变化？"], "read": [{"title": "Corso et al., DiffDock", "url": "https://arxiv.org/abs/2210.01776"}, {"title": "Buttenschoen et al., PoseBusters（物理合理性与泛化检验）", "url": "https://arxiv.org/abs/2308.05777"}]}, "05-M3.4": {"what": "用基于物理的炼金术自由能方法（如 FEP）计算相对结合自由能，精度高但计算昂贵；机器学习可用于加速、筛选或修正这类计算。", "ask": ["相对结合自由能（RBFE）和绝对结合自由能计算的区别是什么？", "为什么 FEP 常用于先导优化阶段而不是大规模虚拟筛选？", "ML 打分函数与 FEP 可以如何互补？"], "read": [{"title": "Chodera et al., Alchemical free energy methods for drug discovery: progress and challenges（2011 综述）", "url": "https://doi.org/10.1016/j.sbi.2011.01.011"}, {"title": "OpenFE（开源自由能计算生态）", "url": "https://openfree.energy/"}]}, "05-M4.1": {"what": "用生成模型（VAE、强化学习、语言模型、扩散模型等）在化学空间中提出新分子，而不只是筛选已有库；关键是可控地朝目标性质优化。", "ask": ["在连续隐空间里优化分子（VAE）与用强化学习微调生成器，思路有何不同？", "生成分子常用哪些评价指标（有效性、新颖性、多样性等）？它们的局限是什么？", "为什么“模型打分高”的生成分子不一定好？"], "read": [{"title": "Sanchez-Lengeling & Aspuru-Guzik, Inverse molecular design using machine learning（Science 2018 综述）", "url": "https://doi.org/10.1126/science.aat2663"}, {"title": "Gómez-Bombarelli et al., Automatic chemical design using a data-driven continuous representation of molecules", "url": "https://arxiv.org/abs/1610.02415"}]}, "05-M4.2": {"what": "以蛋白结合口袋的三维结构为条件，直接生成放在口袋里的分子（原子类型 + 坐标），常用自回归或等变扩散模型。", "ask": ["为什么口袋条件生成通常需要旋转 / 平移等变的网络？", "三维生成的分子要检查哪些化学与几何合理性？", "用对接分数评价生成分子有什么偏差？"], "read": [{"title": "Peng et al., Pocket2Mol", "url": "https://arxiv.org/abs/2205.07249"}, {"title": "Guan et al., TargetDiff：3D Equivariant Diffusion for Target-Aware Molecule Generation", "url": "https://arxiv.org/abs/2303.03543"}]}, "05-M4.3": {"what": "先生成满足功能约束的蛋白骨架（如 RFdiffusion），再为骨架设计氨基酸序列（如 ProteinMPNN），最后用结构预测与实验筛选验证。", "ask": ["“骨架生成 → 序列设计 → 结构预测自洽检查”这条流程每一步解决什么问题？", "蛋白设计与小分子设计在表示和评价上有何不同？", "计算设计的蛋白为什么仍需要大量实验验证？"], "read": [{"title": "Watson et al., RFdiffusion（Nature 2023）", "url": "https://www.nature.com/articles/s41586-023-06415-8"}, {"title": "Dauparas et al., ProteinMPNN（Science 2022）", "url": "https://doi.org/10.1126/science.add2187"}]}, "05-M4.4": {"what": "真实的分子设计要同时优化活性、选择性、ADMET 与可合成性，属于多目标权衡；需要合理的打分组合与基准来避免模型“钻打分漏洞”。", "ask": ["加权求和、帕累托前沿两种多目标处理方式各有什么问题？", "合成可及性评分（SA score）是怎么估计的？它能代替真实合成路线评估吗？", "什么是生成模型的“奖励投机”（reward hacking）？如何防范？"], "read": [{"title": "Ertl & Schuffenhauer, Synthetic accessibility score（J Cheminform 2009）", "url": "https://doi.org/10.1186/1758-2946-1-8"}, {"title": "Brown et al., GuacaMol: Benchmarking Models for De Novo Molecular Design", "url": "https://arxiv.org/abs/1811.09621"}]}, "05-M4.5": {"what": "逆合成从目标分子反推可行的合成路线，由单步反应预测模型 + 多步搜索（如蒙特卡洛树搜索）组成；正向反应预测则判断给定反应物会生成什么。", "ask": ["基于模板与无模板的单步逆合成方法有何区别？", "多步路线规划中，搜索终止条件（可购买原料）为何重要？", "计算给出的路线为什么仍需化学家判断？"], "read": [{"title": "Coley et al., Machine Learning in Computer-Aided Synthesis Planning（Acc Chem Res 2018）", "url": "https://doi.org/10.1021/acs.accounts.8b00087"}, {"title": "AiZynthFinder（开源逆合成规划工具）", "url": "https://github.com/MolecularAI/aizynthfinder"}]}, "05-M5.1": {"what": "实验昂贵时，用代理模型 + 采集函数决定下一批该测哪些分子（主动学习 / 贝叶斯优化），在探索与利用之间权衡，用更少实验找到更好的化合物。", "ask": ["高斯过程代理模型和采集函数（如 EI、UCB）各自承担什么角色？", "批量（batch）选择相比一次选一个多了什么难点？", "主动学习在数据很少的冷启动阶段可能出现什么问题？"], "read": [{"title": "Shahriari et al., Taking the Human Out of the Loop: A Review of Bayesian Optimization（Proc IEEE 2016）", "url": "https://doi.org/10.1109/JPROC.2015.2494218"}, {"title": "BoTorch（PyTorch 贝叶斯优化库）文档", "url": "https://botorch.org/"}]}, "05-M5.2": {"what": "自驱动实验室把设计—合成—测试—分析（DMTA）闭环自动化：算法提出实验，机器人执行，数据回流更新模型；也是 AIDD 与机器人学的直接交汇点。", "ask": ["一个自驱动实验室由哪些模块组成？哪一环通常是瓶颈？", "闭环系统中如何保证实验数据质量与可复现性？", "化学自动化实验和家庭服务机器人在操作需求上有什么共通与差异？"], "read": [{"title": "Tom et al., Self-Driving Laboratories for Chemistry and Materi  "https://modernrobotics.northwestern.edu/"}]}, "06-M1.4": {"what": "移动机器人运动学描述轮速与底盘运动的关系：差速驱动受非完整约束不能侧移，全向轮 / 麦克纳姆轮底盘可在平面内任意方向移动。", "ask": ["什么是非完整约束？差速底盘为什么不能直接侧向平移？", "如何由左右轮速计算差速底盘的线速度与角速度？", "居家服务机器人选择底盘类型时要考虑哪些因素？"], "read": [{"title": "Lynch & Park, Modern Robotics（第 13 章轮式移动机器人）", "url": "https://modernrobotics.northwestern.edu/"}]}, "06-M2.1": {"what": "刚体动力学描述力 / 力矩与运动的关系；牛顿—欧拉法逐个连杆递推，拉格朗日法从能量出发，最终都得到“质量矩阵 × 加速度 + 科氏 / 离心项 + 重力项 = 关节力矩”的形式。", "ask": ["动力学方程中各项分别代表什么物理意义？", "正动力学与逆动力学分别用于仿真还是控制？", "为什么递推牛顿—欧拉法计算效率高？"], "read": [{"title": "Lynch & Park, Modern Robotics（第 8 章开链动力学）", "url": "https://modernrobotics.northwestern.edu/"}, {"title": "Pinocchio（高效刚体动力学库）", "url": "https://github.com/stack-of-tasks/pinocchio"}]}, "06-M2.2": {"what": "操作任务离不开接触：摩擦锥描述不打滑的接触力范围，力封闭 / 形封闭描述抓取能否抵抗任意外力，接触建模也是仿真与 sim2real 的难点。", "ask": ["库仑摩擦锥的含义是什么？", "力封闭与形封闭有何区别？", "为什么接触丰富的任务在仿真中容易失真？"], "read": [{"title": "Bicchi & Kumar, Robotic grasping and contact: a review（ICRA 2000）", "url": "https://doi.org/10.1109/ROBOT.2000.844081"}, {"title": "Lynch & Park, Modern Robotics（第 12 章抓取与操作）", "url": "https://modernrobotics.northwestern.edu/"}]}, "06-M2.3": {"what": "腿足与人形机器人需要在支撑多边形内维持平衡；零力矩点（ZMP）是经典的步行稳定性判据，现代方法还结合模型预测控制与强化学习。", "ask": ["ZMP 与支撑多边形是什么关系？", "静态平衡与动态平衡有何区别？", "为什么强化学习近年在腿足运动控制中表现突出？"], "read": [{"title": "Vukobratović & Borovac, Zero-Moment Point — Thirty Five Years of Its Life（2004）", "url": "https://doi.org/10.1142/S0219843604000083"}]}, "06-M3.1": {"what": "ROS 2 是机器人软件的通用中间件：节点之间通过话题（发布 / 订阅）、服务（请求 / 响应）和动作（带反馈的长任务）通信，底层基于 DDS。", "ask": ["话题、服务、动作分别适合什么场景？", "QoS 设置（可靠性、历史深度）会影响什么？", "如何用命令行工具查看正在运行的节点和话题？"], "read": [{"title": "ROS 2 文档：Concepts", "url": "https://docs.ros.org/en/rolling/Concepts.html"}]}, "06-M3.2": {"what": "URDF（ROS 常用）与 MJCF（MuJoCo）用 XML 描述机器人的连杆、关节、惯性参数、碰撞与可视几何，是仿真、规划与控制共享的模型基础。", "ask": ["URDF 中 link 与 joint 各包含哪些信息？", "碰撞几何与可视几何为什么常分开定义？", "惯性参数不准会对仿真与控制造成什么影响？"], "read": [{"title": "ROS 2 文档：URDF 教程", "url": "https://docs.ros.org/en/rolling/Tutorials/Intermediate/URDF/URDF-Main.html"}, {"title": "MuJoCo XML Reference（MJCF）", "url": "https://mujoco.readthedocs.io/en/stable/XMLreference.html"}]}, "06-M3.3": {"what": "机器人系统里有大量随时间变化的坐标系（地图、底盘、相机、夹爪等），TF2 负责维护它们之间带时间戳的变换；多传感器数据还需时间同步才能正确融合。", "ask": ["TF 树为什么必须是树结构？", "查询“过去某一时刻”的变换有什么用？", "相机与机械臂之间的手眼标定解决什么问题？"], "read": [{"title": "ROS 2 文档：About tf2", "url": "https://docs.ros.org/en/rolling/Concepts/Intermediate/About-Tf2.html"}]}, "06-M3.4": {"what": "底层电机控制需要确定周期内完成计算（实时性）；常见做法是实时操作系统或实时内核 + 固定频率控制回路，上层规划与感知则在非实时部分运行。", "ask": ["软实时与硬实时有何区别？", "控制周期抖动会对系统造成什么影响？", "ros2_control 在硬件抽象中扮演什么角色？"], "read": [{"title": "ros2_control 文档", "url": "https://control.ros.org/"}]}, "06-M4.1": {"what": "常见机器人形态包括固定机械臂、移动底盘、移动操作（底盘 + 机械臂）、四足与人形；形态决定可达空间、负载、安全性与成本，养老场景常需移动操作能力。", "ask": ["移动操作机器人相比固定机械臂多了哪些技术难点？", "人形形态在家居环境中的潜在优势与代价是什么？", "为什么许多落地的养老产品选择更简单的形态？"], "read": [{"title": "Billard & Kragic, Trends and challenges in robot manipulation（Science 2019）", "url": "https://doi.org/10.1126/science.aat8414"}]}, "06-M4.2": {"what": "执行器把电能转为运动：电机 + 减速器是主流方案；串联弹性、准直驱等设计提升力控性能与碰撞安全性，是人机交互机器人的关键。", "ask": ["高减速比带来哪些好处与坏处？", "串联弹性执行器为什么有利于力控和安全？", "反向驱动性（backdrivability）对人机交互有什么意义？"], "read": [{"title": "Pratt & Williamson, Series elastic actuators（IROS 1995）", "url": "https://doi.org/10.1109/IROS.1995.525827"}]}, "06-M4.3": {"what": "机器人的感觉来自编码器（关节位置）、IMU（姿态与加速度）、力 / 力矩与触觉传感器、相机与深度相机、激光雷达等，不同传感器在精度、成本与隐私影响上差别很大。", "ask": ["编码器和 IMU 分别能测什么、不能测什么？", "触觉传感对灵巧操作有何价值？", "在居家场景中，哪些传感器更容易引发隐私担忧？"], "read": [{"title": "Dahiya et al., Tactile Sensing—From Humans to Humanoids（IEEE TRO 2010）", "url": "https://doi.org/10.1109/TRO.2009.2033627"}]}, "06-M4.4": {"what": "末端执行器从简单的二指夹爪、吸盘到多指灵巧手不等；灵巧手自由度高、可做精细操作，但控制、感知与成本挑战也更大。", "ask": ["二指夹爪能完成哪些家务任务？哪些任务需要多指手？", "欠驱动手的设计思路是什么？", "为什么灵巧操作是机器人学习的热点和难点？"], "read": [{"title": "Billard & Kragic, Trends and challenges in robot manipulation（Science 2019）", "url": "https://doi.org/10.1126/science.aat8414"}]}, "06-M4.5": {"what": "与人近距离工作的机器人必须限制速度、力和能量，并能检测碰撞后安全响应；协作机器人相关要求见 ISO 10218 系列与 ISO/TS 15066 等标准（以 ISO 官网最新版本为准）。", "ask": ["碰撞检测、隔离与识别分别指什么？", "速度与距离监控、功率与力限制是两种什么样的协作安全思路？", "面对体弱老人时，安全阈值的设计需要额外考虑什么？"], "read": [{"title": "Haddadin et al., Robot Collisions: A Survey on Detection, Isolation, and Identification（IEEE TRO 2017）", "url": "https://doi.org/10.1109/TRO.2017.2723903"}]}, "07-M1.1": {"what": "针孔相机模型用内参（焦距、主点）和畸变参数描述成像，外参描述相机在世界中的位姿；标定用已知图案估计这些参数，是测距与手眼协调的前提。", "ask": ["内参与外参分别描述什么？", "镜头畸变有哪几类？如何校正？", "标定误差会如何影响抓取精度？"], "read": [{"title": "OpenCV: Camera Calibration（官方教程）", "url": "https://docs.opencv.org/4.x/dc/dbb/tutorial_py_calibration.html"}]}, "07-M1.2": {"what": "目标检测输出物体类别与框，实例分割输出逐像素掩码；开放词汇方法用文本描述指定任意类别，让机器人能找“蓝色药盒”这类训练集中未必出现的物体。", "ask": ["检测、语义分割、实例分割的输出有何不同？", "开放词汇检测是如何利用图文预训练的？", "在杂乱家居场景中，检测的主要失败来源有哪些？"], "read": [{"title": "Liu et al., Grounding DINO（开放集目标检测）", "url": "https://arxiv.org/abs/2303.05499"}, {"title": "Minderer et al., Simple Open-Vocabulary Object Detection with Vision Transformers（OWL-ViT）", "url": "https://arxiv.org/abs/2205.06230"}]}, "07-M1.3": {"what": "视觉基础模型在大规模数据上预训练，提供通用视觉能力：CLIP 类模型对齐图像与文本，SAM 类模型可按提示分割任意物体，DINO 类自监督模型提供通用视觉特征。", "ask": ["CLIP 的对比学习目标是什么？", "SAM 接受哪些类型的提示？", "机器人策略为什么常用预训练视觉编码器而不是从零训练？"], "read": [{"title": "Radford et al., Learning Transferable Visual Models From Natural Language Supervision（CLIP）", "url": "https://arxiv.org/abs/2103.00020"}, {"title": "Kirillov et al., Segment Anything", "url": "https://arxiv.org/abs/2304.02643"}]}, "07-M2.1": {"what": "深度相机（结构光、ToF、双目）提供每个像素的距离，可转换为点云；点云处理包括滤波、降采样、配准、分割与法向估计，深度学习方法可直接处理点集。", "ask": ["不同深度传感原理在透明、反光物体上为何容易失效？", "ICP 配准的基本思路是什么？", "PointNet 如何实现对点顺序不敏感？"], "read": [{"title": "Open3D 文档", "url": "https://www.open3d.org/docs/release/"}, {"title": "Qi et al., PointNet", "url": "https://arxiv.org/abs/1612.00593"}]}, "07-M2.2": {"what": "6D 位姿估计求物体相对相机的三维位置和三维姿态，是精确抓取与放置的基础；新方法可处理训练时未见过的物体。", "ask": ["基于模型（有 CAD）与无模型的位姿估计有何区别？", "对称物体为什么让位姿估计变得困难？", "如何评价位姿估计的精度？"], "read": [{"title": "Wen et al., FoundationPose", "url": "https://arxiv.org/abs/2312.08344"}, {"title": "BOP: Benchmark for 6D Object Pose Estimation", "url": "https://bop.felk.cvut.cz/"}]}, "07-M2.3": {"what": "三维场景可用体素、网格、点云，或神经辐射场（NeRF）、3D 高斯泼溅等表示；新型表示能从多视角图像重建逼真场景，也被用于构建仿真与数字孪生。", "ask": ["NeRF 和 3D 高斯泼溅在渲染速度与表示方式上有何不同？", "这些表示用于机器人时有哪些局限（如动态物体、几何精度）？", "如何把重建场景用于仿真训练？"], "read": [{"title": "Mildenhall et al., NeRF", "url": "https://arxiv.org/abs/2003.08934"}, {"title": "Kerbl et al., 3D Gaussian Splatting for Real-Time Radiance Field Rendering", "url": "https://arxiv.org/abs/2308.04079"}]}, "07-M3.1": {"what": "SLAM 同时估计机器人位姿并构建环境地图，按传感器分为视觉、视觉惯性和激光 SLAM；回环检测与图优化用于消除累积误差。", "ask": ["为什么定位和建图需要“同时”进行？", "回环检测解决什么问题？", "居家环境（家具移动、光照变化）对 SLAM 有什么挑战？"], "read": [{"title": "Cadena et al., Past, Present, and Future of SLAM", "url": "https://arxiv.org/abs/1606.05830"}, {"title": "Campos et al., ORB-SLAM3", "url": "https://arxiv.org/abs/2007.11898"}]}, "07-M3.2": {"what": "语义地图在几何地图上标注物体与区域含义，三维场景图把房间、物体及其关系组织成图结构，便于机器人理解“药在卧室床头柜上”这类指令。", "ask": ["场景图中的节点和边分别可以表示什么？", "开放词汇场景图如何借助视觉语言模型构建？", "语义地图如何服务于 LLM 任务规划？"], "read": [{"title": "Gu et al., ConceptGraphs: Open-Vocabulary 3D Scene Graphs", "url": "https://arxiv.org/abs/2309.16650"}, {"title": "Hughes et al., Hydra: A Real-time Spatial Perception System for 3D Scene Graph Construction", "url": "https://arxiv.org/abs/2201.13360"}]}, "07-M4.1": {"what": "人体姿态估计从图像中检测关节关键点，进一步结合时间序列可识别动作；它是跌倒检测、康复评估与人机交互的基础。", "ask": ["自顶向下与自底向上的多人姿态估计有何区别？", "2D 关键点用于动作识别有哪些局限？", "遮挡和非常规视角会如何影响结果？"], "read": [{"title": "Cao et al., OpenPose", "url": "https://arxiv.org/abs/1812.08008"}, {"title": "MediaPipe（端侧姿态估计等方案）", "url": "https://ai.google.dev/edge/mediapipe"}]}, "07-M4.2": {"what": "跌倒检测可基于可穿戴传感器、环境传感器（雷达、红外、压力等）或视觉；各方案在准确率、误报、佩戴依从性、隐私与成本上各有取舍。", "ask": ["可穿戴方案为什么常面临依从性问题？", "视觉方案的隐私风险如何缓解？", "评价跌倒检测系统时为什么要特别关注误报率？"], "read": [{"title": "Mubashir, Shao & Seed, A survey on fall detection: Principles and approaches（Neurocomputing 2013）", "url": "https://doi.org/10.1016/j.neucom.2011.09.037"}, {"title": "MSD Manual: Falls in Older Adults（了解跌倒的临床背景）", "url": "https://www.msdmanuals.com/professional/geriatrics/falls-in-older-adults/falls-in-older-adults"}]}, "07-M4.3": {"what": "语音识别把语音转为文字，配合语言模型实现自然对话；老年人的口音、语速、构音障碍以及家中噪声都会影响识别效果。", "ask": ["大规模弱监督训练的语音识别模型有什么优势？", "老年用户语音交互的常见失败场景有哪些？", "语音交互中如何设计确认机制来避免误操作？"], "read": [{"title": "Radford et al., Robust Speech Recognition via Large-Scale Weak Supervision（Whisper）", "url": "https://arxiv.org/abs/2212.04356"}]}, "07-M4.4": {"what": "情绪与认知状态识别试图从表情、语音、行为推断内在状态，但面部动作与情绪之间并非一一对应，结论需审慎，并涉及明显的伦理与隐私问题。", "ask": ["为什么“从表情读情绪”的科学依据存在争议？", "在照护场景误判情绪可能带来什么后果？", "什么情况下这类技术只应作为辅助提示？"], "read": [{"title": "Barrett et al., Emotional Expressions Reconsidered（Psychol Sci Public Interest 2019）", "url": "https://doi.org/10.1177/1529100619832930"}]}, "07-M5.1": {"what": "触觉传感提供接触位置、压力分布与滑动信息，弥补视觉在遮挡和精细接触中的不足，对抓取易碎物体和人体接触尤为重要。", "ask": ["触觉传感器有哪些常见原理？", "触觉信息如何帮助检测抓取滑动？", "触觉数据为何难以大规模采集与建模？"], "read": [{"title": "Dahiya et al., Tactile Sensing—From Humans to Humanoids（IEEE TRO 2010）", "url": "https://doi.org/10.1109/TRO.2009.2033627"}]}, "07-M5.2": {"what": "多传感器融合结合不同传感器的优势；卡尔曼滤波及其扩展在“预测—更新”框架下融合带噪声的观测，是定位与状态估计的基础工具。", "ask": ["卡尔曼滤波的预测步和更新步分别做什么？", "扩展卡尔曼滤波如何处理非线性？", "IMU 与轮式里程计融合能解决什么问题？"], "read": [{"title": "Labbe, Kalman and Bayesian Filters in Python（开源交互式教材）", "url": "https://github.com/rlabbe/Kalman-and-Bayesian-Filters-in-Python"}]}, "08-M1.1": {"what": "PID 控制根据误差的比例、积分和微分计算控制量，是最常用的反馈控制方法；经典控制还关注稳定性、响应速度、超调与稳态误差。", "ask": ["P、I、D 三项各自对响应有什么影响？", "积分饱和（windup）是什么？如何处理？", "为什么微分项对噪声敏感？"], "read": [{"title": "Ang, Chong & Li, PID control system analysis, design, and technology（IEEE TCST 2005）", "url": "https://doi.org/10.1109/TCST.2005.847331"}]}, "08-M1.2": {"what": "模型预测控制（MPC）在每个控制周期基于系统模型预测未来一段时间的行为，求解带约束的优化问题，只执行第一步控制并滚动重复。", "ask": ["“滚动时域”是什么意思？", "MPC 为什么天然适合处理约束？", "MPC 的计算开销对控制频率有什么影响？"], "read": [{"title": "Rawlings, Mayne & Diehl, Model Predictive Control: Theory, Computation, and Design（作者公开电子版）", "url": "https://sites.engineering.ucsb.edu/~jbraw/mpc/"}]}, "08-M1.3": {"what": "阻抗 / 导纳控制不直接控制位置或力，而是让机器人表现出期望的“弹簧—阻尼”动态特性，使其在接触环境或与人交互时柔顺、安全。", "ask": ["阻抗控制与导纳控制的输入输出有何不同？", "刚度设置过高或过低分别会有什么问题？", "为什么人机物理交互常需要柔顺控制？"], "read": [{"title": "Hogan, Impedance Control: An Approach to Manipulation（1985）", "url": "https://doi.org/10.1115/1.3140702"}]}, "08-M1.4": {"what": "全身控制（WBC）为高自由度机器人（人形、移动操作）同时协调多个任务（平衡、手部轨迹、避碰等），常通过优先级分层或二次规划求解关节指令。", "ask": ["多任务冲突时，优先级分层如何处理？", "为什么 WBC 常表述为二次规划（QP）？", "WBC 与上层学习策略可以如何结合？"], "read": [{"title": "Sentis & Khatib, Synthesis of Whole-Body Behaviors through Hierarchical Control of Behavioral Primitives（2005）", "url": "https://doi.org/10.1142/S0219843605000594"}]}, "08-M2.1": {"what": "采样式规划在高维构型空间随机采样无碰撞状态并连接成路径，RRT 适合单次查询，PRM 适合同一环境多次查询；算法具有概率完备性。", "ask": ["构型空间（C-space）是什么？", "RRT 与 PRM 的构建方式有何不同？", "为什么采样式方法在高维机械臂规划中比网格搜索更实用？"], "read": [{"title": "OMPL: The Open Motion Planning Library", "url": "https://ompl.kavrakilab.org/"}]}, "08-M2.2": {"what": "轨迹优化把运动规划写成优化问题，在满足动力学、碰撞与关节限制的前提下最小化时间、能量或平滑度等代价，常与采样式规划互补。", "ask": ["直接法与间接法轨迹优化有何区别？", "为什么轨迹优化容易陷入局部最优？", "采样式规划的结果如何作为轨迹优化的初值？"], "read": [{"title": "Underactuated Robotics（MIT 公开课程讲义，含轨迹优化）", "url": "https://underactuated.mit.edu/"}]}, "08-M2.3": {"what": "移动导航由全局规划（在地图上找路径）与局部规划（实时避障、跟踪路径）组成，配合定位与代价地图在动态环境中运行。", "ask": ["全局规划与局部规划各解决什么问题？", "代价地图中的膨胀层有什么作用？", "家中有人走动、宠物和杂物时，导航需要注意什么？"], "read": [{"title": "Nav2 文档（ROS 2 导航框架）", "url": "https://docs.nav2.org/"}]}, "08-M2.4": {"what": "抓取规划确定在物体哪里、以什么姿态抓取；可基于物体模型分析，也可用深度学习从点云或图像直接生成抓取候选并评估成功率。", "ask": ["抓取质量指标通常考虑哪些因素？", "基于学习的 6 自由度抓取生成与平面抓取有何不同？", "抓取药盒、水杯这类日常物体有哪些特殊难点？"], "read": [{"title": "Mahler et al., Dex-Net 2.0", "url": "https://arxiv.org/abs/1703.09312"}, {"title": "Sundermeyer et al., Contact-GraspNet", "url": "https://arxiv.org/abs/2103.14127"}]}, "08-M3.1": {"what": "任务与运动规划（TAMP）同时决定“做哪些动作、按什么顺序”（离散的任务层）和“具体怎么动”（连续的运动层），用于长程操作任务。", "ask": ["为什么任务规划与运动规划需要联合考虑？", "符号规划语言（如 PDDL）在 TAMP 中的作用是什么？", "LLM 能否替代传统任务规划器？有哪些风险？"], "read": [{"title": "Garrett et al., Integrated Task and Motion Planning", "url": "https://arxiv.org/abs/2010.01083"}]}, "08-M3.2": {"what": "行为树与状态机是组织机器人行为的两种方式；行为树以树形结构组合顺序、选择与并行节点，模块化好、易于扩展和调试，广泛用于导航与服务机器人。", "ask": ["行为树的 Sequence 与 Fallback 节点分别如何工作？", "行为树相比有限状态机的优势是什么？", "如何在行为树中加入“失败后请求人工帮助”的分支？"], "read": [{"title": "Colledanchise & Ögren, Behavior Trees in Robotics and AI: An Introduction", "url": "https://arxiv.org/abs/1709.00084"}, {"title": "BehaviorTree.CPP 文档", "url": "https://www.behaviortree.dev/"}]}, "08-M3.3": {"what": "大语言模型可把自然语言指令分解为技能序列或生成调用机器人 API 的代码，再由底层技能执行；关键是把语言计划与机器人实际能力、环境状态对齐。", "ask": ["SayCan 如何把 LLM 的建议与技能可执行性结合？", "“代码即策略”方法有哪些优点和安全隐患？", "LLM 规划出错时，系统应如何检测与恢复？"], "read": [{"title": "Ahn et al., Do As I Can, Not As I Say（SayCan）", "url": "https://arxiv.org/abs/2204.01691"}, {"title": "Liang et al., Code as Policies", "url": "https://arxiv.org/abs/2209.07753"}]}, "08-M4.1": {"what": "人机共融的安全控制通过限速、限力、保持距离和碰撞检测后的安全反应，降低机器人对人的伤害风险；相关要求见协作机器人国际标准（以官方最新版为准）。", "ask": ["碰撞后机器人有哪些常见的安全反应策略？", "速度与距离监控需要哪些感知能力？", "为什么老年人和儿童需要更保守的安全参数？"], "read": [{"title": "Haddadin et al., Robot Collisions: A Survey on Detection, Isolation, and Identification（IEEE TRO 2017）", "url": "https://doi.org/10.1109/TRO.2017.2723903"}]}, "08-M4.2": {"what": "共享控制让人和机器人共同决定动作：机器人推断人的意图，在人的输入与自主行为之间做仲裁，并把自身意图反馈给人。", "ask": ["意图检测可以利用哪些信号？", "仲裁策略如何在“听人的”与“机器人自主”之间平衡？", "共享控制在助行或喂食辅助中如何应用？"], "read": [{"title": "Losey et al., A Review of Intent Detection, Arbitration, and Communication Aspects of Shared Control for Physical Human–Robot Interaction（2018）", "url": "https://doi.org/10.1115/1.4039145"}]}, "08-M4.3": {"what": "助行、搀扶与移位辅助机器人直接承受人的部分体重，控制需结合人的步态与意图，提供恰当的支撑与柔顺性，并严格防止失稳与跌倒。", "ask": ["助行机器人需要感知使用者的哪些状态？", "支撑力过大或过小分别会带来什么风险？", "这类设备为什么往往要按医疗器械或康复器械管理？"], "read": [{"title": "Losey et al., A Review of Intent Detection, Arbitration, and Communication Aspects of Shared Control for Physical Human–Robot Interaction（2018）", "url": "https://doi.org/10.1115/1.4039145"}, {"title": "MSD Manual: Gait Disorders in Older Adults", "url": "https://www.msdmanuals.com/professional/geriatrics/gait-disorders-in-older-adults/gait-disorders-in-older-adults"}]}, "09-M1.1": {"what": "马尔可夫决策过程（MDP）用状态、动作、转移、奖励和折扣因子形式化序贯决策；价值函数衡量长期回报，贝尔曼方程给出价值的递归关系。", "ask": ["状态价值函数与动作价值函数有何区别？", "折扣因子取值大小对智能体行为有何影响？", "贝尔曼最优方程与策略迭代 / 价值迭代是什么关系？"], "read": [{"title": "OpenAI Spinning Up in Deep RL（入门讲解与代码）", "url": "https://spinningup.openai.com/"}]}, "09-M1.2": {"what": "策略梯度方法直接优化参数化策略的期望回报；PPO 通过限制每次更新的幅度提高训练稳定性，是机器人仿真训练中最常用的算法之一。", "ask": ["策略梯度中的优势函数起什么作用？", "PPO 的裁剪目标如何限制策略更新幅度？", "为什么 PPO 适合大规模并行仿真？"], "read": [{"title": "Schulman et al., Proximal Policy Optimization Algorithms", "url": "https://arxiv.org/abs/1707.06347"}, {"title": "OpenAI Spinning Up: PPO 讲解", "url": "https://spinningup.openai.com/"}]}, "09-M1.3": {"what": "离策略（off-policy）方法可复用历史经验：DQN 用深度网络近似动作价值并依靠经验回放与目标网络稳定训练，SAC 在最大化回报的同时最大化策略熵，适合连续控制。", "ask": ["经验回放与目标网络分别解决什么问题？", "为什么 DQN 不直接适用于连续动作空间？", "SAC 中熵正则项的作用是什么？"], "read": [{"title": "Mnih et al., Human-level control through deep reinforcement learning（Nature 2015）", "url": "https://doi.org/10.1038/nature14236"}, {"title": "Haarnoja et al., Soft Actor-Critic", "url": "https://arxiv.org/abs/1801.01290"}]}, "09-M1.4": {"what": "奖励函数决定智能体学到什么；设计不当会导致“奖励投机”。安全强化学习在训练和部署中加入约束或风险考量，避免危险行为。", "ask": ["稀疏奖励与稠密奖励各有什么优缺点？", "举一个奖励投机的例子，并说明如何修正。", "约束 MDP 如何表达安全要求？"], "read": [{"title": "García & Fernández, A Comprehensive Survey on Safe Reinforcement Learning（JMLR 2015）", "url": "https://jmlr.org/papers/v16/garcia15a.html"}]}, "09-M1.5": {"what": "离线强化学习只用预先收集的数据集学习策略、不与环境交互，适合真实机器人等交互昂贵的场景，主要难点是数据分布之外动作的价值高估。", "ask": ["离线 RL 与行为克隆有何区别？", "分布外动作为什么会导致价值高估？", "保守 / 约束类方法如何缓解这一问题？"], "read": [{"title": "Levine et al., Offline Reinforcement Learning: Tutorial, Review, and Perspectives on Open Problems", "url": "https://arxiv.org/abs/2005.01643"}]}, "09-M2.1": {"what": "行为克隆把示教数据当作监督学习，直接学习“观测 → 动作”；它的主要问题是分布偏移：小误差会把机器人带到示教中没出现过的状态并持续累积，DAgger 通过在线收集专家纠正来缓解。", "ask": ["为什么行为克隆的误差会随时间累积？", "DAgger 的数据收集流程是怎样的？", "增加示教的多样性为什么能提升鲁棒性？"], "read": [{"title": "Ross, Gordon & Bagnell, A Reduction of Imitation Learning and Structured Prediction to No-Regret Online Learning（DAgger）", "url": "https://arxiv.org/abs/1011.0686"}]}, "09-M2.2": {"what": "动作分块（action chunking）一次预测未来一段动作序列而非单步动作，降低误差累积与抖动；ACT 用 Transformer（CVAE 结构）实现这一思路，在精细双臂操作上效果显著。", "ask": ["动作分块为什么能缓解误差累积？", "ACT 中 CVAE 的隐变量起什么作用？", "时间集成（temporal ensembling）解决了什么问题？"], "read": [{"title": "Zhao et al., Learning Fine-Grained Bimanual Manipulation with Low-Cost Hardware（ACT / ALOHA）", "url": "https://arxiv.org/abs/2304.13705"}]}, "09-M2.3": {"what": "扩散策略把动作生成建模为条件去噪过程，能表达多峰的动作分布；流匹配是另一类生成方法，可用更少的采样步生成连续动作，也被用于 VLA 的动作头。", "ask": ["为什么普通回归在多峰示教（如绕左或绕右）下会失败？", "扩散策略推理时的采样步数如何影响控制频率？", "流匹配与扩散模型的训练目标有何不同？"], "read": [{"title": "Chi et al., Diffusion Policy", "url": "https://arxiv.org/abs/2303.04137"}, {"title": "Lipman et al., Flow Matching for Generative Modeling", "url": "https://arxiv.org/abs/2210.02747"}]}, "09-M2.4": {"what": "逆强化学习从专家示教中反推奖励函数，再据此学习策略；相比直接模仿，它试图理解“专家为什么这样做”，从而更好地泛化。", "ask": ["为什么同一组示教可以对应多个奖励函数？", "学徒学习（apprenticeship learning）的基本思路是什么？", "逆强化学习与生成对抗模仿学习有何联系？"], "read": [{"title": "Abbeel & Ng, Apprenticeship learning via inverse reinforcement learning（ICML 2004）", "url": "https://doi.org/10.1145/1015330.1015430"}]}, "09-M3.1": {"what": "示教数据可通过遥操作（手柄、主从臂、VR）或手持采集设备获取；采集方式决定数据质量、成本与可扩展性，是模仿学习效果的关键。", "ask": ["主从臂遥操作与 VR 遥操作各有什么优缺点？", "手持采集设备如何在没有机器人的情况下收集示教？", "示教质量（犹豫、失败片段）会如何影响策略？"], "read": [{"title": "Chi et al., Universal Manipulation Interface（手持示教采集）", "url": "https://arxiv.org/abs/2402.10329"}, {"title": "ALOHA 项目页（低成本主从双臂遥操作）", "url": "https://tonyzhaozh.github.io/aloha/"}]}, "09-M3.2": {"what": "大规模机器人数据集汇集多种机器人与任务的示教，以统一格式发布，用于预训练通用策略；数据格式、标注与质量控制同样重要。", "ask": ["跨本体数据集需要统一哪些信息（观测、动作空间、语言指令）？", "示教数据中的哪些因素对离线学习影响最大？", "如何从大数据集中挑选与自己任务相关的子集？"], "read": [{"title": "Open X-Embodiment Collaboration, Open X-Embodiment: Robotic Learning Datasets and RT-X Models", "url": "https://arxiv.org/abs/2310.08864"}, {"title": "Mandlekar et al., What Matters in Learning from Offline Human Demonstrations for Robot Manipulation（robomimic）", "url": "https://arxiv.org/abs/2108.03298"}]}, "09-M3.3": {"what": "人类视频（如第一人称日常活动视频）数量巨大，可用来预训练视觉表示或学习任务结构，但缺少机器人动作标签，且人与机器人身体差异大。", "ask": ["人类视频能为机器人学习提供哪些信息？", "人与机器人的“本体差异”如何影响迁移？", "预训练视觉表示通常如何接入下游策略？"], "read": [{"title": "Nair et al., R3M: A Universal Visual Representation for Robot Manipulation", "url": "https://arxiv.org/abs/2203.12601"}]}, "09-M4.1": {"what": "世界模型学习环境如何随动作变化，智能体可以在“想象”中规划或训练策略；基于模型的强化学习通常比无模型方法更省数据。", "ask": ["世界模型通常预测什么（像素、隐状态、奖励）？", "模型误差会如何影响基于模型的规划？", "在隐空间中想象训练有什么优势？"], "read": [{"title": "Ha & Schmidhuber, World Models", "url": "https://arxiv.org/abs/1803.10122"}, {"title": "Hafner et al., Mastering Diverse Domains through World Models（DreamerV3）", "url": "https://arxiv.org/abs/2301.04104"}]}, "09-M4.2": {"what": "动作条件的视频生成模型可作为“可交互的模拟器”，根据动作生成未来画面，用于策略训练或评估；目前物理一致性与可控性仍是主要限制。", "ask": ["视频生成模拟器与物理仿真器各有什么优缺点？", "如何检验生成视频中的物理是否可信？", "这类模拟器在评估机器人策略时可能产生什么偏差？"], "read": [{"title": "Yang et al., Learning Interactive Real-World Simulators（UniSim）", "url": "https://arxiv.org/abs/2310.06114"}]}, "10-M1.1": {"what": "视觉—语言—动作模型（VLA）以图像和语言指令为输入、直接输出机器人动作，希望把视觉语言模型从网络数据中学到的语义知识迁移到机器人控制上。", "ask": ["VLA 与“LLM 规划 + 传统技能库”的系统有何区别？", "网络预训练知识能为机器人带来哪些泛化能力？", "VLA 目前主要的局限有哪些？"], "read": [{"title": "Ma et al., A Survey on Vision-Language-Action Models for Embodied AI", "url": "https://arxiv.org/abs/2405.14093"}, {"title": "Brohan et al., RT-2", "url": "https://arxiv.org/abs/2307.15818"}]}, "10-M1.2": {"what": "VLA 输出动作的方式主要有三类：把连续动作离散化为 token 让语言模型逐个生成；用回归式连续动作头；用扩散或流匹配生成连续动作块。", "ask": ["动作离散化 token 的优缺点是什么？", "为什么高频灵巧操作更偏好连续动作块？", "动作表示如何影响推理速度？"], "read": [{"title": "Black et al., π0: A Vision-Language-Action Flow Model for General Robot Control", "url": "https://arxiv.org/abs/2410.24164"}, {"title": "Brohan et al., RT-2", "url": "https://arxiv.org/abs/2307.15818"}]}, "10-M1.3": {"what": "跨本体泛化指一个模型能控制形态、传感器和动作空间不同的多种机器人；通常靠多机器人混合数据预训练，再在目标机器人上少量微调。", "ask": ["不同机器人在动作空间上的差异如何统一或适配？", "跨本体数据为什么可能帮助单个机器人的性能？", "迁移到新机器人时通常需要多少、什么样的数据？"], "read": [{"title": "Open X-Embodiment Collaboration, Open X-Embodiment: Robotic Learning Datasets and RT-X Models", "url": "https://arxiv.org/abs/2310.08864"}, {"title": "Octo Model Team, Octo: An Open-Source Generalist Robot Policy", "url": "https://arxiv.org/abs/2405.12213"}]}, "10-M2.1": {"what": "RT-1 用 Transformer 在大规模真实机器人示教数据上学习“图像 + 指令 → 离散动作”；RT-2 在此基础上把视觉语言模型与机器人数据联合微调，展现出更强的语义泛化；RT-X 用跨机构数据训练。", "ask": ["RT-1 与 RT-2 的模型来源和训练数据有何不同？", "RT-2 的“涌现”语义能力体现在哪些评测上？", "为什么这两个模型的思路影响了后续开源 VLA？"], "read": [{"title": "Brohan et al., RT-1: Robotics Transformer for Real-World Control at Scale", "url": "https://arxiv.org/abs/2212.06817"}, {"title": "Brohan et al., RT-2", "url": "https://arxiv.org/abs/2307.15818"}]}, "10-M2.2": {"what": "OpenVLA 是开源的 7B 参数 VLA，基于预训练视觉语言模型输出离散动作 token；Octo 是较轻量的开源通用策略，用扩散头输出动作；二者都在 Open X-Embodiment 数据上训练并支持微调。", "ask": ["OpenVLA 与 Octo 在模型规模与动作头设计上有何不同？", "在自己的机器人上微调它们需要准备哪些数据？", "开源权重对研究可复现性有什么意义？"], "read": [{"title": "Kim et al., OpenVLA: An Open-Source Vision-Language-Action Model", "url": "https://arxiv.org/abs/2406.09246"}, {"title": "Octo Model Team, Octo: An Open-Source Generalist Robot Policy", "url": "https://arxiv.org/abs/2405.12213"}]}, "10-M2.3": {"what": "π0 在预训练视觉语言模型上接一个用流匹配生成连续动作块的“动作专家”，在多种机器人数据上训练，面向高频、灵巧的操作任务；代码与权重通过 openpi 开源。", "ask": ["“动作专家”与 VLM 主干之间如何分工？", "流匹配动作头相比离散 token 有什么优势？", "用 openpi 微调需要准备什么格式的数据？"], "read": [{"title": "Black et al., π0: A Vision-Language-Action Flow Model for General Robot Control", "url": "https://arxiv.org/abs/2410.24164"}, {"title": "openpi（官方代码与权重）", "url": "https://github.com/Physical-Intelligence/openpi"}]}, "10-M2.4": {"what": "“语言规划 + 技能”路线中，大模型负责理解指令、分解任务，底层技能负责执行：SayCan 用价值函数约束 LLM 的建议，PaLM-E 把传感器输入直接注入语言模型进行具身推理。", "ask": ["SayCan 中的“可供性（affordance）”是如何估计的？", "PaLM-E 如何把图像等连续输入接入语言模型？", "这一路线与端到端 VLA 相比有哪些优劣？"], "read": [{"title": "Ahn et al., Do As I Can, Not As I Say（SayCan）", "url": "https://arxiv.org/abs/2204.01691"}, {"title": "Driess et al., PaLM-E: An Embodied Multimodal Language Model", "url": "https://arxiv.org/abs/2303.03378"}]}, "10-M2.5": {"what": "人形机器人基础模型是快速变化的行业方向，多家公司与研究机构发布了面向人形的通用模型；学习时以公开技术报告为准，关注数据来源、架构与评测方式，避免轻信宣传。", "ask": ["人形基础模型常用哪些数据来源（真机、仿真、人类视频）？", "如何区分技术报告中的可复现结果与演示视频？", "人形机器人在养老场景落地还有哪些现实障碍？"], "read": [{"title": "NVIDIA, GR00T N1: An Open Foundation Model for Generalist Humanoid Robots（技术报告示例）", "url": "https://arxiv.org/abs/2503.14734"}]}, "10-M3.1": {"what": "分层架构让慢速的大模型做高层理解与规划，快速的底层策略或控制器负责高频执行，兼顾语义能力与实时性，是当前具身系统的常见设计。", "ask": ["高层与底层之间用什么接口（语言子任务、目标位姿、技能编号）？", "为什么不能让大模型直接以控制频率输出所有动作？", "分层系统中错误如何在层间传播与恢复？"], "read": [{"title": "Ahn et al., Do As I Can, Not As I Say（SayCan）", "url": "https://arxiv.org/abs/2204.01691"}, {"title": "Black et al., π0", "url": "https://arxiv.org/abs/2410.24164"}]}, "10-M3.2": {"what": "把 VLA 用到自己的机器人上通常需要微调：LoRA 等参数高效方法降低显存需求；部署时还需考虑量化、推理延迟与控制频率之间的平衡。", "ask": ["LoRA 为什么能大幅减少需要训练的参数？", "量化会对动作精度产生什么影响？", "推理延迟过高时有哪些工程手段（动作分块、异步执行）？"], "read": [{"title": "Hu et al., LoRA: Low-Rank Adaptation of Large Language Models", "url": "https://arxiv.org/abs/2106.09685"}, {"title": "Kim et al., OpenVLA（含微调与部署实验）", "url": "https://arxiv.org/abs/2406.09246"}]}, "10-M3.3": {"what": "具身智能体在模型之外还需要记忆、工具调用、环境反馈与长程任务管理，例如根据执行结果反思并修正计划、积累可复用的技能。", "ask": ["环境反馈如何帮助语言模型修正计划？", "技能库的积累对长程任务有什么帮助？", "照护场景中，智能体需要记住哪些长期信息？如何保护隐私？"], "read": [{"title": "Huang et al., Inner Monologue: Embodied Reasoning through Planning with Language Models", "url": "https://arxiv.org/abs/2207.05608"}, {"title": "Wang et al., Voyager: An Open-Ended Embodied Agent with Large Language Models", "url": "https://arxiv.org/abs/2305.16291"}]}, "10-M4.1": {"what": "评测 VLA 需结合仿真基准与真机实验：仿真基准可复现、成本低，但与真实表现存在差距；一些工作专门研究如何让仿真评测更贴近真机结果。", "ask": ["仿真评测与真机评测各有什么局限？", "一个好的机器人基准
